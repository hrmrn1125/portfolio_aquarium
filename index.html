<!doctype html>
<html lang="ja" data-theme="aquarium">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071e34">
<meta name="description" content="深海水族館。原 茉利奈のWeb・UI・UX、会話設計の実績と経歴を巡るポートフォリオ。">
<title>深海水族館 | Marina Hara Portfolio</title>
<style>:root{color-scheme:dark;--bg:#2f254b;--ink:#fff8fa;--soft:#eee1f7;--accent:#ffe8b4;--button:#fce5f0;--button-ink:#3f264d;--panel:#382748;--line:#ffffff43;--serif:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif}
[data-theme=aquarium]{--bg:#062238;--ink:#edfff9;--soft:#ccedea;--accent:#97f4df;--button:#a9f5e7;--button-ink:#082f36;--panel:#092c3d;--line:#a5f8f14d}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,"Hiragino Sans",sans-serif}
main{position:relative;min-height:100svh;display:grid;align-items:center;padding:100px clamp(22px,7vw,112px) 110px;isolation:isolate;overflow:hidden}
canvas,.veil{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.veil{z-index:-1;background:linear-gradient(90deg,#1e153fee 0%,#21173d98 32%,transparent 68%),linear-gradient(0deg,#201637ac,transparent 28%);pointer-events:none}
[data-theme=aquarium] .veil{background:linear-gradient(90deg,#031625f7,#03162599 37%,transparent 73%),linear-gradient(0deg,#021623ba,transparent 25%)}
header{position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:max(16px,env(safe-area-inset-top)) clamp(18px,4vw,60px) 14px}
a{color:inherit;text-underline-offset:4px}
header a{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.wordmark{display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;font-family:Georgia,serif;font-size:1.15rem}
.wordmark small{font: .73rem system-ui;letter-spacing:.08em;color:var(--soft)}
.mark{border:1px solid var(--line);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--accent)}
.intro,.station{max-width:520px}
.eyebrow{font-size:.85rem;font-weight:650;letter-spacing:.24em;color:var(--accent);margin:0 0 15px}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(3.1rem,7.8vw,8rem);white-space:nowrap;letter-spacing:.025em}
[data-theme=aquarium] h1{letter-spacing:-.06em}
.station h2{font-size:clamp(2.6rem,5.7vw,5.4rem)}
.lead,#station-copy{color:var(--soft);max-width:29em;margin:20px 0 24px;line-height:1.9}
.primary{background:var(--button);color:var(--button-ink);border:0;padding:.78rem 1.55rem;border-radius:100px;font-weight:720}
[data-theme=aquarium] .primary{border-radius:8px}
nav{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:clamp(18px,4vw,60px);right:clamp(18px,4vw,60px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:720px}
nav button{min-height:52px;border:1px solid var(--line);border-radius:100px;background:#19112fae;padding:5px;font-size:.875rem}
[data-theme=aquarium] nav button{border-radius:6px;background:#042137d9}
nav button[aria-current=true]{background:var(--button);color:var(--button-ink);font-weight:750}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(850px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;overscroll-behavior:contain}
dialog::backdrop{background:#05051caa;backdrop-filter:blur(8px)}
.modal-bar{display:flex;position:sticky;top:0;background:var(--panel);padding:12px clamp(16px,4vw,38px);gap:12px;z-index:1;border-bottom:1px solid var(--line)}
.modal-bar button{background:transparent;border:1px solid var(--line);border-radius:100px;padding:7px 14px}
#close{margin-left:auto}
#detail{padding:24px clamp(16px,4vw,38px) 38px}
#detail h2{font-size:clamp(1.85rem,5vw,3.1rem);line-height:1.24}
#detail h3{margin-bottom:6px}
#detail section{margin:22px 0}
#detail li{margin:8px 0}
#detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:12px 0;border-block:1px solid var(--line)}
dd{margin:0}
.work-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px;margin-top:20px}
.work{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:#ffffff0a;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0}
.work img{width:100%;height:118px;object-fit:cover;object-position:top;background:#ffffff10}
.work span{padding:12px}
.gallery{display:grid;gap:18px;justify-items:center}
.gallery img{display:block;width:auto;max-width:100%;height:auto;max-height:420px;object-fit:contain;background:#ffffff0c;border:1px solid var(--line)}
.no-js{position:absolute;bottom:18px;left:18px}
@media(max-width:650px){
 main{align-items:end;padding:78px 20px max(99px,calc(env(safe-area-inset-bottom) + 82px))}
 .wordmark small{display:none}
 .veil,[data-theme=aquarium] .veil{background:linear-gradient(0deg,var(--bg) 3%,color-mix(in srgb,var(--bg) 92%,transparent) 25%,transparent 69%)}
 .intro h1{font-size:clamp(2.45rem,12.5vw,4.5rem)}
 .station h2{font-size:clamp(2.2rem,10vw,3.6rem)}
 .eyebrow{margin-bottom:8px}
 .lead,#station-copy{margin:10px 0 15px}
 nav button{min-height:46px}
}

/* Let the environment fill the screen. Keep the route and the guide within thumb reach. */
:root{--bg:#241e39;--button:#fff4dd;--button-ink:#392946;--accent:#ffe5ad}
[data-theme=aquarium]{--bg:#020c16;--button:#ddfff5;--button-ink:#082e35;--accent:#9efbdb}
main{min-height:100svh;align-items:end;padding:88px clamp(22px,6vw,96px) clamp(112px,17vh,154px);touch-action:pan-y}
[data-theme=aquarium] main{touch-action:pinch-zoom}
canvas{pointer-events:none}
.veil,[data-theme=aquarium] .veil{background:linear-gradient(0deg,#151128ec,transparent 37%),linear-gradient(90deg,#1b142e96,transparent 62%)}
[data-theme=aquarium] .veil{background:linear-gradient(0deg,#020a15ed,transparent 43%),linear-gradient(90deg,#020b199e,transparent 67%)}
header{border:0;align-items:center}
header a{opacity:.86;text-decoration:none}
.wordmark{font-size:1rem}
.mark{width:32px;height:32px}
.intro,.station{max-width:530px}
.intro h1{font-size:clamp(3.2rem,7vw,6.6rem)}
.station h2{font-size:clamp(2.4rem,5.2vw,4.5rem)}
.eyebrow{margin:0 0 8px;letter-spacing:.17em}
.lead{font-size:1rem;margin:13px 0 20px}
#catalog{display:inline-flex;align-items:center;gap:18px;margin-top:17px;padding:.62rem 1rem .62rem 1.15rem}
.catalog-icon{font-size:1.1rem;font-weight:400}
.navigation{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:4px;border:1px solid var(--line);border-radius:100px;background:#171029ba;backdrop-filter:blur(18px);width:max-content;max-width:calc(100% - 16px)}
[data-theme=aquarium] .navigation{background:#021523ce}
.navigation nav{position:static;display:flex;gap:2px}
.navigation button,.navigation nav button,[data-theme=aquarium] .navigation nav button{border:0;border-radius:100px;min-height:42px;padding:0 clamp(8px,2vw,16px);background:none;font-size:.875rem}
.navigation > button{font-size:1.45rem;font-family:system-ui;line-height:1;min-width:42px;padding:0}
.navigation > button:disabled{opacity:.25;cursor:default}
.navigation nav button[aria-current=true],[data-theme=aquarium] .navigation nav button[aria-current=true]{background:var(--button);color:var(--button-ink)}
.gesture{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 49px);font-size:.8rem;color:var(--soft);white-space:nowrap;pointer-events:none}
.depth{position:absolute;right:clamp(22px,5vw,70px);top:76px;font:500 .85rem ui-monospace,monospace;letter-spacing:.16em;color:var(--accent);text-shadow:0 1px 12px #00101e}
@media(max-width:650px){
 main{padding:80px 20px max(114px,calc(env(safe-area-inset-bottom) + 100px))}
 .intro h1{font-size:clamp(2.5rem,12vw,4.3rem)}
 .station h2{font-size:clamp(2.05rem,9vw,3.4rem)}
 .lead{margin:9px 0 15px}
 .veil,[data-theme=aquarium] .veil{background:linear-gradient(0deg,var(--bg) 4%,transparent 65%)}
}
@media(max-width:340px){.navigation nav button,[data-theme=aquarium] .navigation nav button{padding-inline:6px}.navigation>button{min-width:36px}}
header{text-shadow:0 1px 10px #1d18348f}
@media(max-width:650px){
 [data-theme=zoo] header{background:linear-gradient(#33214469,transparent)}
}
@media(max-height:500px) and (orientation:landscape){
 main{padding-top:66px;padding-bottom:78px}
 .intro h1{font-size:2.55rem}
 .station h2{font-size:2.15rem}
 .gesture{display:none}
}
</style>

<script id="data" type="application/json">[{"id":"web1","title":"カボニューレコード / フェーズ2","category":"Web / UI","role":"デザイン/コードレビュー/コーディング/開発/ライティング","body":"エコ活動記録Webアプリです。\n\nフェーズ1では以前の上長(クライアント)要望もあり、アプリらしいシンプルなデザインとしておりました。\n\n上長異動を機にユーザーの声をより強く反映しようという方針となり、ユーザー分析の結果を踏まえ、\n\nキャラクターをより強調し親しみを持たせ、世界観もそれに合わせていこうということになりました。\n\nまた、これまで「エコなことを知ってたくさん環境貢献行動していこう」という、\n\n比較的環境貢献意識の高い層へ向けたコンセプトであったところから、\n\n「自分にできることから始めて、エコなことをあまりできていないなという罪悪感を軽減させる」\n\nといったより広範な層に向けたコンセプトへと変えていきました。\n\n人員異動による経緯の擦り合わせ等が少し大変でしたが、自分主導で業務の進め方やデザイン・機能案出しを\n\n行っていくことで円滑に業務を進めることができ、より良いサービスへと変えていけたと思います。\n\n※一部デザインのみ掲載","images":["caboreco2-1.jpg","caboreco2-2.jpg","caboreco2-3.jpg","caboreco2-4.jpg"],"dimensions":{"caboreco2-1.jpg":{"width":1280,"height":5230},"caboreco2-2.jpg":{"width":375,"height":7016},"caboreco2-3.jpg":{"width":1500,"height":4832},"caboreco2-4.jpg":{"width":1500,"height":5356}},"startedAt":"2024-02","period":"2024.02 — 2024.10","intro":"エコ活動記録Webアプリのリニューアル。ユーザー分析を踏まえ、コンセプトとキャラクターの見せ方を見直したフェーズです。","scope":"一般利用者向けWebアプリ／9名体制・デザイナー1名","sections":[{"title":"背景・ねらい","body":"環境貢献意識が高い層に向けた『エコを知り、環境貢献行動を増やす』という方針から、『自分にできることから始め、十分にエコ活動ができていないという罪悪感を軽減する』という、より広い層に届くコンセプトへの転換を目指しました。"},{"title":"担当範囲","bullets":["クライアントへのヒアリング、要件・機能・デザイン提案、ワイヤーフレーム〜カンプ制作。","サービス全体のデザイン、コーダーへの指示・コードレビュー、一部コーディング・開発、ライティング・校正。","UI定例の主催、クライアント・PMとの仕様やデザインのすり合わせ。"]},{"title":"意識したこと","bullets":["ユーザーの声と分析結果を踏まえ、キャラクターを前面に出して親しみを持てる見せ方へ変更。画面全体の世界観も合わせて再設計しました。","見た目の変更だけで終わらせず、利用者が無理なく行動を始められるというコンセプトに、デザインと機能の両面から立ち返りました。","担当者の異動に伴う経緯の確認を行い、自分から進め方やデザイン・機能案を提示して、判断しやすい状態をつくりました。"]},{"title":"成果・取り組み","body":"シンプルなアプリ調のフェーズ1から、キャラクターと親しみやすさを軸とする表現へ刷新。仕様変更の多い開発のなかで、デザイン・実装双方の観点から提案し、継続的なサービス改善に携わりました。"},{"title":"事業規模・制作体制","fact":"利用者393,994人／新規登録は1日平均60〜70人（2024年9月3日時点の利用者数）","body":"PM・PM補佐・SE・コーダー等を含む9名体制で、デザイナーは1名。サービス開始前からフェーズ1・2を通して参画しました。","note":"利用者数はサービス全体の規模です。自身の施策単独の獲得数や、このリニューアルによる増加数を示すものではありません。掲載画像は一部です。"}]},{"id":"web2","title":"カボニューレコードフェーズ1","category":"Web / UI","role":"デザイン/コードレビュー/コーディング/開発/ライティング","body":"エコ活動記録Webアプリです。\n\n上長(クライアント)要望もあり、アプリらしいシンプルなデザインとしました。\n\n開発チームとして参画していたため、コーダーのみならずエンジニアとも密に連携を取りながら\n\n自分主催のUI定例にてデザイン・機能案出しを行いました。\n\nアジャイル開発ということで頻繁に仕様変更やクライアント要望が挙がってきて、それに素早く対応していく\n\nということを、デザイン観点や開発観点など様々な立場から考えて行っていくのが勉強になりました。\n\nまたユーザー数(現在約40万人)やその動向等が随時共有され確認できるようになっており、\n\nマーケティング知識もより深まりました。\n\n※一部デザインのみ掲載","images":["caboreco1-1.jpg","caboreco1-2.jpg","caboreco1-3.jpg","caboreco1-4.jpg"],"dimensions":{"caboreco1-1.jpg":{"width":664,"height":1213},"caboreco1-2.jpg":{"width":375,"height":2220},"caboreco1-3.jpg":{"width":375,"height":812},"caboreco1-4.jpg":{"width":1500,"height":3248}},"startedAt":"2022-08","period":"2022.08 — 2024.01","intro":"エコ活動を記録するWebアプリの立ち上げ・初期デザイン。サービス開始前からデザイナー1名体制で参画しました。","scope":"一般利用者向けWebアプリ／9名体制・デザイナー1名","sections":[{"title":"ねらい","body":"環境貢献活動を知り、日常の行動を記録できるサービスを制作。クライアントの意向を踏まえ、アプリらしいシンプルなUIで情報や機能を分かりやすく見せることを目指しました。"},{"title":"担当範囲","bullets":["サービス全体のデザイン、ワイヤーフレーム〜カンプ、デザイン・機能の提案。","クライアントへのヒアリング、UI定例の主催、コーダーへの指示・コードレビュー。","一部コーディング・開発、ライティング・校正、運用保守。"]},{"title":"意識したこと","bullets":["コーダーだけでなくエンジニアとも連携し、実装や仕様を考慮しながらUIを検討しました。","自分が主催するUI定例で案を提示し、変更が生じた際も、デザインと開発双方の立場から対応方法を考えました。","利用者数や利用動向の共有を受け、ユーザー像とサービスの目的に立ち返ることを重視しました。"]},{"title":"成果・学び","body":"立ち上げ前からサービスの全体デザインを担当し、継続的な機能追加・仕様変更に対応。アジャイル開発での進め方、チーム開発、利用動向を踏まえたデザインの検討を経験しました。"},{"title":"事業規模・制作体制","fact":"サービス全体の利用者：約40万人／新規登録：1日平均60〜70人（2024年10月時点）","body":"9名のプロジェクトでデザイナーは1名。規模の数値はフェーズ1・2を含むプロジェクト全体の情報です。","note":"自身のデザイン単独の効果を示す数値ではありません。掲載画像は一部です。"}]},{"id":"web3","title":"Release株式会社/コーポレートサイト","category":"Web / UI","role":"デザイン/ライティング","body":"介護現場のDX化を促進する「カイホウ」というサービスを運営する企業様がクライアントでした。\n\nクライアントとしては「採用活動時にコーポレートサイトがある方が心象が良い」とのお考えでご依頼いただきました。\n\nもうすぐ採用を開始したいというタイミングでご依頼いただいたため、スピード感を持ってデザインしました。\n\nサービスLPは別途あるため、シンプルに企業理念を提示することと、それでもお問い合わせ機会は確保することを重視しました。\n\nまた、素材とコンテンツ量が限られていたため、コーポレートサイトとしての見応えがあるようにという点と、\n\n単調にならないようにという点に気をつけて構成・コンテンツ配置をしました。\n\n※本番環境はクライアント側で随時デザイン編集している可能性があります。","images":["Release-1.jpg","Release-2.jpg"],"dimensions":{"Release-1.jpg":{"width":1280,"height":6470},"Release-2.jpg":{"width":375,"height":6580}},"startedAt":"2024-05","period":"2024.05","intro":"介護現場のDXサービス『カイホウ』を運営するRelease株式会社のコーポレートサイト。採用開始に向けて、デザインとライティングを担当しました。","scope":"介護DX事業者の企業サイト／採用・企業理解・問い合わせ","sections":[{"title":"背景・ねらい","body":"採用活動時の企業への印象を整えたいという依頼が出発点です。サービスLPは別にあるため、企業理念を簡潔に伝えつつ、問い合わせの機会も確保する構成を目指しました。"},{"title":"担当範囲","body":"サイトのデザイン、掲載文章のライティング・校正を担当。採用開始が近い時期の依頼だったため、スピード感を持って制作しました。"},{"title":"意識したこと","bullets":["素材やコンテンツ量が限られていても、企業サイトとして見応えが出るよう、構成と配置を検討しました。","情報を詰め込みすぎず、企業理念が伝わることと、問い合わせ導線を設けることを両立しました。","単調なページにならないよう、コンテンツの見せ方に変化をつけました。"]},{"title":"制作内容・成果","body":"採用に向けた企業サイトのデザインと原稿を制作。サービス紹介に偏らず、企業の考え方と問い合わせ先を提示するサイトにまとめました。","note":"掲載画像は制作時点のものです。公開サイトはクライアント側で変更されている場合があります。"}]},{"id":"web4","title":"カイホウ for SPOT/LP","category":"Web / UI","role":"デザイン/ライティング","body":"介護現場のDX化を促進する「カイホウ」というサービスを運営する企業様がクライアントでした。\n\n福祉事業所と収入を増やしたいタクシードライバーをつなぐ新サービスのLPをご依頼いただきました。\n\nクライアント側として強調したい文言が多く、トップや見出しをできるだけシンプルにするよう\n\n調整・説明をするのが少し大変でした。\n\nパッと見たときに「タクシードライバー」が対象であることが分かるようにしました。\n\nまた、素材とコンテンツ量が限られていたため、単調にならないよう気をつけて構成・コンテンツ配置をしました。\n\nコーポレートサイトとのある程度の統一感も持たせ、既存顧客からの拡販も意識しました。\n\n※本番環境はクライアント側で随時デザイン編集している可能性があります。","images":["kaihou-1.jpg","kaihou-2.jpg"],"dimensions":{"kaihou-1.jpg":{"width":1280,"height":2998},"kaihou-2.jpg":{"width":375,"height":3260}},"startedAt":"2024-05","period":"2024.05","intro":"福祉事業所と収入を増やしたいタクシードライバーをつなぐ、新サービス『カイホウ for SPOT』のLPです。","scope":"介護DX領域の新サービス／タクシードライバー向けLP","sections":[{"title":"ねらい","body":"一目でタクシードライバー向けのサービスだと分かり、利用を検討できるLPを目指しました。コーポレートサイトとのつながりを持たせ、既存顧客への拡販も意識しました。"},{"title":"担当範囲","body":"LP全体のデザイン、ライティング・校正。クライアントが強調したい内容を聞き取り、トップや見出しで伝える情報を整理しました。"},{"title":"意識したこと","bullets":["強調したい文言が多いなかで、トップと見出しはできるだけシンプルにし、対象者とサービス内容が埋もれないよう調整しました。","限られた素材・コンテンツでも単調にならないよう、構成と配置を検討しました。","コーポレートサイトと一定の統一感を保ち、同じ事業者のサービスとして認識できる見せ方にしました。"]},{"title":"制作内容・成果","body":"新サービスを紹介するLPのデザインと原稿を制作。訴求内容の優先順位を整理し、対象者に伝わる入口をつくりました。","note":"公開サイトはクライアント側でデザインを変更している場合があります。"}]},{"id":"web5","title":"デザメモ/LP","category":"Web / UI","role":"企画/デザイン/コーディング/開発/ライティング","body":"「デザメモ」というデザインカリキュラムを社内外向けに制作し、そのLPも制作しました。\n\n若者向けに親しみやすさを大事にしたかったことや、勉強に集中できる色ということも\n\n踏まえて、ベースカラーを黄色にしています。\n\nその黄色の雰囲気と「デザメモ」という名前から、全体を通してメモや付箋をイメージした\n\nオブジェクトを散りばめるようにして、ポップにしました。\n\nまた、LPとして上から読んでいった際のストーリー性を大切にし、ユーザーが重視するであろう\n\nコンテンツから読み進めていって、最後に購入の後押しをされるように構成しました。\n\n公開した際に社内の若手社員から「素敵だなと思いました」等の声を多数いただき、\n\n思った通りのターゲットに刺さるものにできて良かったなと思いました。","images":["dezamemoLP-1.jpg","dezamemoLP-2.jpg"],"dimensions":{"dezamemoLP-1.jpg":{"width":1280,"height":6550},"dezamemoLP-2.jpg":{"width":375,"height":9763}},"startedAt":"2024-06","period":"2024.06 — 2024.09","intro":"デザイン学習サービス『デザメモ』を紹介するLP。企画からデザイン・実装・文章制作まで担当しました。","scope":"社内外向け教育サービス／若いデザイン初学者向けLP","sections":[{"title":"ねらい","body":"若い初学者が親しみを感じ、サービスを理解して購入を検討できるページを目指しました。上から読み進める順序に沿って、興味・理解・購入の後押しにつながるストーリーを組み立てました。"},{"title":"担当範囲","body":"企画・構成、デザイン、コーディング・開発、ライティング・校正。カリキュラム本体とLPの世界観を揃えました。"},{"title":"意識したこと","bullets":["若者への親しみやすさと学習する場の印象を意図し、黄色をベースカラーとして選びました。","名前の『メモ』と黄色の雰囲気から、メモや付箋をイメージしたあしらいを散りばめ、ポップな世界観にしました。","利用者が重視する情報から読み始め、最後に購入を後押しする順番でコンテンツを配置しました。"]},{"title":"成果・反応","body":"公開後、社内の若手社員から『素敵だなと思いました』などの声を複数受けました。想定した若い層から、デザインに対する好意的な反応を得られた制作です。","note":"社員からの感想であり、購入率や売上の改善を示すものではありません。"}]},{"id":"web6","title":"フロントエンドカリキュラム","category":"Web / UI","role":"企画/デザイン/コーディング/開発/ライティング","body":"フロントエンドカリキュラムを社内外向けにパッケージ化しようとしています。\n\n現在社内でbacklogを活用し教育実施していますが、Wikiが多くなってくると見づらい状況です。\n\nそのため読みやすさを重視したデザイン・内容にしていく予定です。\n\n既にデザインカリキュラムをパッケージ化していますが、そちらがポップテイストなので\n\nフロントエンドは少し堅めに、Wikiとしての色あいを濃くしていきたいと思います。","images":["front-1.jpg"],"dimensions":{"front-1.jpg":{"width":2628,"height":5360}},"startedAt":"2024-04","period":"2024.04","intro":"社内で使うフロントエンド教材を、社内外向けの学習サービスとしてパッケージ化するための制作です。","scope":"フロントエンド初学者向け教材","sections":[{"title":"背景・ねらい","body":"BacklogのWikiで社内教育を行うなかで、ページが増えると読みづらくなるという課題がありました。内容とデザインを整理し、学習資料として読みやすい教材にすることを目指しました。"},{"title":"担当範囲","body":"企画・要件整理、教材の構成・デザイン、コーディング・開発、文章作成・校正。社員教育とカリキュラム外販にも携わりました。"},{"title":"意識したこと","bullets":["教材の内容に集中でき、必要な説明を読み取りやすい構成を重視しました。","ポップなデザインカリキュラム『デザメモ』とは表現を分け、フロントエンド教材は少し堅めの、Wikiらしい読み物としての見せ方を検討しました。"]},{"title":"制作内容","body":"教材のパッケージ化に向け、構成・デザインと文章を整理。学習内容を読み取りやすい教材画面を制作しました。"}]},{"id":"web7","title":"デザメモ / 教育Webアプリ","category":"Web / UI","role":"企画/デザイン/コーディング/開発/ライティング","body":"「デザメモ」は、デザインカリキュラムを社内外向けにパッケージ化したものです。\n\n自分の勉強したことや、実務経験で得た知識を誰にでも理解できるように言語化しました。\n\nデザイン面ではキャラクターを登場させたり、メモを意識したあしらいを採り入れたりして、\n\n授業を受けている感覚で没入できるビジュアルにしました。\n\nデザインもコーディングもライティングもとにかく量が多く(異なる内容で50ページ以上)、\n\nVue.jsを利用し動きをつけた部分もあまり通常サイトで使わない動かし方にせざるをえなかったため、\n\n作業が山積みで中々リリースできなかった点が苦労した点です。\n\nセキュリティ面や販促マーケティングなども含め、網羅的に勉強になりました。\n\n※一部デザインのみ掲載","images":["dezamemo-1.jpg","dezamemo-2.jpg"],"dimensions":{"dezamemo-1.jpg":{"width":1280,"height":800},"dezamemo-2.jpg":{"width":1280,"height":3730}},"startedAt":"2024-04","period":"2024.04 — 2024.09","intro":"社内外向けのデザインカリキュラムをパッケージ化した教育Webアプリ『デザメモ』です。","scope":"デザイン初学者向け教育Webアプリ／異なる内容を持つ50ページ以上","sections":[{"title":"ねらい","body":"自分が学んだ知識と実務経験を、初学者にも理解できる言葉に置き換えて教材にすることを目指しました。授業を受けるような感覚で学習に入り込める、親しみやすい体験を設計しました。"},{"title":"担当範囲","body":"企画構想・要件定義、デザイン、コーディング・開発、ライティング・校正。Vue.js・Firebase・HTML・CSS・JavaScript等を使用しました。"},{"title":"意識したこと","bullets":["キャラクターやメモを意識したあしらいを取り入れ、説明を読むだけの教材ではなく、世界観を感じながら学べるビジュアルにしました。","デザインの知識を専門用語だけで説明せず、実務で得た経験も含めて言語化しました。","教材固有の動きをVue.jsで実装し、通常のサイトとは異なる学習コンテンツの見せ方に取り組みました。"]},{"title":"成果・制作規模","fact":"異なる内容を持つ50ページ以上を制作","body":"デザイン・実装・文章制作のすべてでボリュームのある教材を制作。コンテンツ量と独自の動きの実装により公開準備に時間を要した経験から、セキュリティや販促・マーケティングも含めて学びました。","note":"ページ数は制作物の規模です。利用者数や販売実績を示すものではありません。掲載画像は一部です。"}]},{"id":"web8","title":"社内ポータル / Webアプリ","category":"Web / UI","role":"企画/デザイン/コーディング/開発/ライティング","body":"社内限で使うWebアプリ(イントラのようなもの)を、次の効果を期待し制作しています。\n\n(1) ツールを一箇所にまとめることで、管理が煩雑でなくなる\n\n(2) 会社と社員の共通アクセスポイントとなり、相互に働きかけがしやすくなる\n\n(3) 研修(カリキュラム)をより充実させることができ、より実践力のある社員が育つ\n\nデザインはお知らせの見やすさと、必要ツールの見つけやすさを重視しています。\n\n管理者でログインするとお知らせや資料投稿ができるなど、必要不可欠な機能は既に完成しています。\n\nカレンダーやeラーニング、デジタル社員証などを実装したいと考えているところです。\n\n※一部デザインのみ掲載","images":["convicom-1.jpg","convicom-2.jpg"],"dimensions":{"convicom-1.jpg":{"width":1280,"height":800},"convicom-2.jpg":{"width":750,"height":1624}},"startedAt":"2024-02","period":"2024.02 —","intro":"社員が必要なツールや情報へアクセスするための社内ポータルWebアプリです。","scope":"自社社員向けイントラネット／2024年時点で一部機能を実装","sections":[{"title":"背景・ねらい","bullets":["ツールを一か所にまとめ、管理の煩雑さを軽減すること。","会社と社員の共通アクセスポイントをつくり、相互に働きかけやすくすること。","研修・カリキュラムを充実させ、実践力のある社員の育成につなげること。"]},{"title":"担当範囲","body":"企画・構想、デザイン、コーディング・開発、ライティング。必要な情報のまとまりや、機能の優先順位を検討しました。"},{"title":"意識したこと","body":"お知らせが読みやすく、必要なツールを見つけやすいことを重視しました。社内情報を単に並べるのではなく、社員がアクセスする入口として整理しました。"},{"title":"実装した内容・制作状況","body":"2024年時点で、管理者ログイン後のお知らせ・資料投稿など、基本機能を実装。カレンダー、eラーニング、デジタル社員証は当時追加を検討していた機能です。","note":"掲載は2024年時点の制作途中の状態です。現在の稼働や、検討中だった機能の完成を示すものではありません。"}]},{"id":"web9","title":"建設会社調達サイト","category":"Web / UI","role":"デザイン","body":"古くなっており見づらい調達サイトを、見やすくリニューアルしました。\n\nこれにより協力会社との連携を図りやすくする目的もあるとのことでした。\n\n参考にできるようなサイトが無かった点が少し大変でした。\n\nかっちりしたシンプルなサイトにも合う、少し遊び心のあるあしらいを色々と考える機会となりました。\n\n※実ページ開示が難しいため自作したデザインのみ提示します。","images":["kensetsu-1.jpg","kensetsu-2.jpg","kensetsu-3.jpg"],"dimensions":{"kensetsu-1.jpg":{"width":1920,"height":1402},"kensetsu-2.jpg":{"width":1920,"height":2450},"kensetsu-3.jpg":{"width":750,"height":1334}},"startedAt":"2023-09","period":"2023.09","intro":"建設会社の調達サイトを、情報の見やすさと協力会社との連携を意識してリニューアルした案件です。","scope":"建設会社・協力会社向けの調達サイト","sections":[{"title":"背景・ねらい","body":"古くなり見づらくなっていた調達サイトを改善し、協力会社との連携を図りやすくすることが目的でした。"},{"title":"担当範囲","body":"サイトのデザインを担当。参考にできる同種のサイトが少ないなかで、用途に合う見せ方を検討しました。"},{"title":"意識したこと","body":"調達サイトとしての堅実さ・シンプルさを保ちながら、少し遊び心を感じられるあしらいを検討。見た目の古さを見直しつつ、業務で使うサイトとして情報を読み取りやすくすることを重視しました。"},{"title":"制作内容・掲載範囲","body":"調達サイトのリニューアルデザインを制作しました。","note":"実ページは開示できないため、掲載は独自に制作した提示用デザインです。実案件の画面そのものではありません。"}]},{"id":"web10","title":"株式会社CONVICTION/コーポレートサイト","category":"Web / UI","role":"デザイン監修","body":"ボタンやサムネイル画像などの軽い制作は行いましたが、基本はデザインの意見出しを行いました。\n\nデザイン・コーディングの実作業は、社内の駆け出しの人員に練習として行ってもらいました。\n\nこれまでもコーポレートサイトは存在しましたが、デザイナーが作ったものではなかったため、\n\nこのリニューアルを行おうという運びとなりました。\n\nテイストとしては、既存社員の平均年齢が27歳程度ということもあり、既存社員同様\n\n若い方の入社を期待して、そのような方にも取っつきやすいライトなテイストにしました。\n\nただし安心してクライアントが案件を任せられるイメージとなるよう、多色の使用は避け、\n\nポップにしすぎず白を基調とし、青っぽいアクセントカラーを入れて信頼感へつながるようにしています。\n\nデザイン性のアピールとして、アニメーションやニューモーフィズムを採り入れています。\n\n※一部デザインのみ掲載","images":["convi-1.jpg","convi-2.jpg"],"dimensions":{"convi-1.jpg":{"width":2694,"height":9578},"convi-2.jpg":{"width":1000,"height":11884}},"startedAt":"2023-08","period":"2023.08 — 2023.11","intro":"株式会社CONVICTIONのコーポレートサイト刷新で、デザイン監修と一部パーツ制作を担当しました。","scope":"自社企業サイト／若手採用と顧客への信頼感を両立","sections":[{"title":"背景・ねらい","body":"既存サイトのデザインを見直すためのリニューアルです。当時の社員の平均年齢が約27歳だったことも踏まえ、若い応募者が親しみを感じることと、クライアントが安心して案件を任せられる印象の両立を目指しました。"},{"title":"担当範囲・制作体制","body":"主にデザインへの意見出し・監修を行い、ボタンやサムネイルなどを一部制作。ページのデザイン・コーディング実作業は、経験の浅い社内メンバーが学習を兼ねて担当しました。"},{"title":"意識したこと","bullets":["若い方に取っつきやすい軽やかさを持たせつつ、多色使いや過度なポップさを避けました。","白を基調に青系のアクセントを入れ、企業としての信頼感を意識しました。","アニメーションやニューモーフィズムを取り入れ、デザイン性も伝えられる表現にしました。"]},{"title":"制作内容・成果","body":"制作メンバーへのデザイン面の助言と、一部パーツの制作を通してサイト刷新に参加しました。","note":"全ページの実制作を単独で担当した案件ではありません。掲載画像は一部です。"}]},{"id":"web11","title":"ePro/LP","category":"Web / UI","role":"デザイン/ライティング","body":"社内で用いているフロントエンド・バックエンド・デザインのカリキュラムを外販化しようという\n\nプロジェクトが進み、それに伴ってLPを制作しました。\n\n3点訴求法や、ペルソナの悩みごとへの問いかけなどをトップで用いて、\n\n最初の段階でまず読み進めたくなるようにという点を意識しました。\n\n寄り添い型のメンターがいることがカリキュラムの特徴でもあるので、それと連動したような優しい色あいのLPにしました。\n\nその優しい中でも少しだけ堅めなバージョンと、少しポップなバージョンを用意しました。\n\nデザイン完成段階で、各種カリキュラムを分けて売ったり、カリキュラム内容を\n\nより充実させてから売ったりしようという方針となり、こちらのデザインは取り下げとなっています。","images":["ePro-3.jpg","ePro-1.jpg","ePro-4.jpg","ePro-2.jpg"],"dimensions":{"ePro-3.jpg":{"width":1920,"height":7291},"ePro-1.jpg":{"width":375,"height":5269},"ePro-4.jpg":{"width":1920,"height":7291},"ePro-2.jpg":{"width":375,"height":5269}},"startedAt":"2023-05","period":"2023.05","intro":"社内のフロントエンド・バックエンド・デザイン教材を外販するプロジェクトに伴い制作したLPです。","scope":"学習カリキュラム販売LP／デザイン完成後に方針変更で取り下げ","sections":[{"title":"ねらい","body":"学習者が自分の悩みと教材の特徴を結びつけ、冒頭から読み進めたくなるLPを目指しました。寄り添うメンターがいるというサービスの特徴も伝えることを意識しました。"},{"title":"担当範囲","body":"LPのデザイン、ライティング・校正。少し堅めの案と、少しポップな案の2方向を用意しました。"},{"title":"意識したこと","bullets":["トップでは3つの訴求点を提示し、ペルソナの悩みへの問いかけを用いて、続きを読むきっかけをつくりました。","伴走型のメンターという特徴と連動させ、優しい配色で安心して学べる印象を意図しました。","同じサービスでも印象を比較できるよう、色調や表現の異なる案を制作しました。"]},{"title":"制作結果・公開状況","body":"デザインは完成しましたが、教材を分けて販売することや内容を充実させてから販売する方針に変更となり、このLP案は取り下げになりました。","note":"公開後の集客・販売実績があるLPではありません。"}]},{"id":"web12","title":"ネット銀行マイページ","category":"Web / UI","role":"デザイン/コーディング/開発","body":"ネット銀行のマイページをVue.jsを用いて開発しました。\n\nほとんど既存ページのデザインや構成を踏襲して、新たにデータを加えページやボタンを足していくという作業でした。\n\nクライアントへ質問や提案(今までに無いような項目はどう表示しようかなど)をすることもあり、\n\nその際はExcel上に起票したり、デザインした画面イメージを貼り付けて共有していました。\n\nまた機能を設計書にまとめる作業もExcelで行いました。\n\n開発体制としてはUIチームに常時6名程度エンジニアがおり、1名がPMといった体制でした。\n\n初めての本格的な開発でVue.jsにもまだ熟達していなかったのと、銀行の取引にも精通していなかったため、\n\nどこにどういった内容のページがあるのかの把握ですら最初は難しかったです。\n\n終業後も毎日のように徹夜で用語等勉強したりコードの書き方を考えたりしたことで、スキルアップにつながったと思います。\n\n※実ページ開示が難しいため自作したものを提示します。CSSをあてきれておりませんがトップ機能は再現できています。","images":["bank-1.jpg"],"dimensions":{"bank-1.jpg":{"width":1213,"height":908}},"startedAt":"2022-02","period":"2022.02 — 2022.07","intro":"ネット銀行マイページの開発案件。既存のデザイン・構成を基に、新しいデータやページ、ボタンを追加する実装とUIの検討を担当しました。","scope":"ネット銀行の顧客向けマイページ／PM1名・SE5名の6名体制","sections":[{"title":"ねらい","body":"既存ページとの一貫性を保ちながら、新たな情報や機能を追加することを目指しました。銀行からのデザイン案を基に、開発側からも使いやすさや表示方法を確認・提案しました。"},{"title":"担当範囲","bullets":["詳細設計、UI設計、Vue.js・HTML・CSS・JavaScriptによる実装。","単体テスト、運用保守・メンテナンス。","Excelでの質問・提案の起票、画面イメージの共有、機能の設計書への整理。"]},{"title":"意識したこと","bullets":["これまでにない情報をどう表示するか、見出しや装飾の差に意図があるかなど、曖昧な点を画面イメージや質問にして共有しました。","APIが完成する前でも進められる実装を先行し、チーム全体の進行を見据えて対応しました。","銀行業務の用語や画面構成、Vue.jsの実装を学びながら、仕様理解と開発スキルを深めました。"]},{"title":"成果・事業規模","body":"銀行マイページのUI検討から実装・単体テスト・保守まで経験。6名の開発体制で、既存サービスへ機能を追加する実務に携わりました。","note":"実案件の画面は非公開です。掲載は同等の機能を独自にデザイン改変・実装した再現制作で、未完成部分はトリミングしています。"}]},{"id":"app1","title":"価値観アプリ / UIデザイン","category":"App","role":"企画/デザイン","body":"同僚のバックエンドを行っている者と2人で個人開発しているアプリです。\n\n(現状Webアプリですが、Androidでもリリース予定)\n\n質問に答えていくとその人の特に重視している価値観が分かり、その価値観とその人のお悩みを掛け合わせて\n\n最適なお悩み解決策を導き出すというアプリです。\n\nChatGPTから着想を得ました。\n\n本アプリはJavaとFirebaseを用いて作っております。\n\n同僚が企画と簡単な要件定義をし、私がそれをデザインに落とし込みながらブラッシュアップ\n\n(この機能は要らない/足した方が良い、ユーザーから見て違和感ある、など)をしています。\n\n思案に耽るようなイメージで緑や紫を用いています。\n\nまとまらない思考とそれを癒すイメージを持って、シンボルマークや背景のグラデーションを制作しました。\n\nユーザーの操作項目が多いので、シンプルさ・分かりやすさも意識しています。\n\n※一部デザインのみ掲載。デザインや仕様は変更となっている場合があります。","images":["mob-login-1.jpg","mob-login-2.jpg","mob-login-3.jpg","mob-login-4.jpg"],"dimensions":{"mob-login-1.jpg":{"width":750,"height":1624},"mob-login-2.jpg":{"width":750,"height":1724},"mob-login-3.jpg":{"width":750,"height":1724},"mob-login-4.jpg":{"width":750,"height":1624}},"startedAt":"2024-07","period":"2024.07","intro":"質問への回答から大切にしている価値観を整理し、悩みの解決策を考えるWebアプリの個人開発です。","scope":"バックエンド担当と2名の個人開発","sections":[{"title":"ねらい","body":"ChatGPTから着想を得て、利用者の価値観と悩みを掛け合わせて解決策を考えられる体験を企画。自分の考えを整理する時間を、落ち着いて過ごせる画面を目指しました。"},{"title":"担当範囲・制作体制","body":"同僚が企画・簡単な要件定義とバックエンドを担当し、自分はデザインに落とし込む過程で機能や体験をブラッシュアップ。開発にはJava・Firebaseが使われています。"},{"title":"意識したこと","bullets":["思案するイメージから緑や紫を用い、まとまらない思考と、それを癒す印象をシンボルマーク・背景のグラデーションで表現しました。","操作項目が多いため、画面自体のシンプルさと分かりやすさを重視しました。","利用者から見て違和感がないか、機能を足す・省く必要がないかも検討しました。"]},{"title":"制作内容","body":"2名でWebアプリを制作し、価値観を整理するための画面とシンボルマーク・背景のグラデーションをデザインしました。"}]},{"id":"app2","title":"FlowTimer","category":"App","role":"企画/デザイン","body":"同僚のバックエンドを行っている者と2人で個人開発したAndroidアプリです。\n\n海外ではタイマーアプリを使うことが比較的多いということを知り、着想を得ました。\n\nシンプルなタイマーアプリですが音のオンオフが簡単にできたり、時間設定方法が直感的であったり、\n\n作業に集中して時間を超過したことが見やすく達成感を得やすくなっていたりと工夫しています。\n\nユーザーに達成感をさらに得てもらうために、リリース後にスタンプ機能を追加しました。\n\nスタンプカードのデザインを選べることや、スタンプが全て貯まったら自分で設定したご褒美を\n\n獲得できる(自己管理サポート)といった、少しのお楽しみ要素を搭載できました。\n\n本アプリはJavaを用いて作っております。\n\n同僚が企画と簡単な要件定義をし、私がそれをデザインに落とし込みながらブラッシュアップ\n\n(この機能は要らない/足した方が良い、ユーザーから見て違和感ある、など)をしました。\n\n集中、生産性向上、シンプルでスッキリといったキーワードから青や白を用いています。\n\nまた線やボタンをできるだけ減らしたり、ニューモーフィズムを採り入れたりしました。\n\n※一部デザインのみ掲載。デザインや仕様は変更となっている場合があります。","images":["timer-app-1.jpg","timer-app-2.jpg","timer-app-3.jpg","timer-app-4.jpg"],"dimensions":{"timer-app-1.jpg":{"width":750,"height":1334},"timer-app-2.jpg":{"width":750,"height":1624},"timer-app-3.jpg":{"width":563,"height":1218},"timer-app-4.jpg":{"width":750,"height":1624}},"startedAt":"2023-03","period":"2023.03 — 2023.11","intro":"集中する時間と達成感を支えるAndroidタイマーアプリ。バックエンド担当の同僚と2名で個人開発しました。","scope":"Androidアプリ／2名の個人開発・公開後の機能追加","sections":[{"title":"ねらい","body":"海外でタイマーアプリの利用が多いことから着想。集中・生産性向上を軸に、シンプルな操作と、使い続ける楽しみがあるアプリを目指しました。"},{"title":"担当範囲・制作体制","body":"同僚が企画・簡単な要件定義とJavaでの開発を担当。自分はUIデザインと、機能の必要性・利用者視点での使いやすさの検討を担当しました。"},{"title":"意識したこと","bullets":["音のオン・オフや時間設定を直感的に操作できること、集中して設定時間を超えたことも見やすく伝わることを意識しました。","青と白を中心に、線やボタンをできるだけ減らし、すっきりした印象に。ニューモーフィズムも取り入れました。","作業を終えるたびに達成感が得られるよう、楽しみの要素を検討しました。"]},{"title":"成果・公開後の改善","body":"Androidアプリを公開後、スタンプ機能を追加。スタンプカードのデザインを選び、貯まったら自分で設定したご褒美を得られる、自己管理を支える機能を形にしました。","note":"掲載画像は制作時点の一部です。現在のストア掲載・仕様は変更されている場合があります。"}]},{"id":"others1","title":"doda広告用バナー・画像","category":"Graphic","role":"デザイン/ライティング","body":"dodaのピックアップページに載せる縦長画像とバナーを制作しました。\n\nにこやかな人間が写っているとバナー等のクリック・閲覧率が高まるので、まずそれを採り入れました。\n\nまた社長やdoda側の広告担当と打ち合わせをし、入れたい文言を聞いてそれを校正・加工して入れました。\n\n何よりも「未経験でも誰でも、自分の想いを形にするモノづくりを始められる」という点が\n\n同職種の魅力なのでそこを強調しました。\n\n同社独自の魅力としては独自のカリキュラムがあることなので、それも盛り込んでいます。\n\nその他訴求点の文章は私が独自に考えたものです。\n\nデザインとしては信頼感や若さを示す青をトップに入れました。\n\nグラデーションと幾何学の組み合わせで、モダンさや学習意欲が湧くのを感じさせるようにしています。","images":["convi-doda-1.jpg","convi-doda-2.jpg","convi-doda-banner-1.jpg"],"dimensions":{"convi-doda-1.jpg":{"width":850,"height":6705},"convi-doda-2.jpg":{"width":850,"height":3353},"convi-doda-banner-1.jpg":{"width":790,"height":566}},"startedAt":"2024-05","period":"2024.05","intro":"dodaのピックアップページに掲載する縦長画像とバナーを制作。採用に向けた訴求の整理からデザイン・文章制作まで担当しました。","scope":"採用広告／ピックアップページ用画像・バナー","sections":[{"title":"ねらい","body":"『未経験でも、自分の想いを形にするモノづくりを始められる』という職種の魅力と、自社独自のカリキュラムがあることを伝える採用広告を目指しました。"},{"title":"担当範囲","body":"社長・dodaの広告担当との打ち合わせ、訴求したい文言の整理・校正、独自のコピー作成、画像・バナーのデザイン。"},{"title":"意識したこと","bullets":["閲覧者が親しみを感じる入口を意図し、にこやかな人物写真を取り入れました。","信頼感と若さを表す意図でトップに青を使用。グラデーションと幾何学的な形で、モダンさと学びへの前向きな印象を表現しました。","要望された文言をそのまま並べず、職種の魅力と独自の教育環境が伝わる文章へ整理しました。"]},{"title":"制作内容・成果","body":"ピックアップページ用の縦長画像とバナーを制作。写真・コピー・配色を組み合わせ、未経験層に向けた採用訴求をまとめました。","note":"写真の採用はデザイン上のねらいであり、この広告によるクリック率の向上を確認したものではありません。"}]},{"id":"others2","title":"カボニューレコード関連バナー・画像","category":"Graphic","role":"デザイン","body":"突然依頼があり、納期が近く、かつデザインにあまりこだわらない(ロゴの視認性さえ担保されていれば良い等)\n\nといった要件が多かったため、デザインも世界観は合わせるもののタイポグラフィに手をかけすぎないようにしていました。\n\n基本ログイン済ユーザーが見るサイト内設置なので、内容が伝わることを重視していました。\n\nロゴの雰囲気に合わせたフォントや、エコを意識させる色を用いることが多かったです。\n\n何パターンか制作し、選択するという進め方を好まれていたようだったので、そのようにしておりました。","images":["banner-1.jpg","banner-2.jpg","banner-3.jpg","banner-4.jpg"],"dimensions":{"banner-1.jpg":{"width":1372,"height":388},"banner-2.jpg":{"width":1242,"height":2208},"banner-3.jpg":{"width":492,"height":492},"banner-4.jpg":{"width":1028,"height":180}},"startedAt":"2022-08","period":"2022.08 —","intro":"カボニューレコード内で利用するバナーや画像。サービスの世界観と、情報がすぐ伝わることを重視した制作です。","scope":"約40万人規模のサービスに関連する画像／主にログイン済み利用者向け","sections":[{"title":"背景・ねらい","body":"短納期の依頼が多く、ロゴの視認性など要件が絞られた制作でした。主にログイン済みの利用者がサイト内で見るため、装飾性より内容を正しく伝えることを重視しました。"},{"title":"担当範囲","body":"サービス内のバナー・画像デザイン。複数案を制作し、選んでもらう進め方で対応しました。"},{"title":"意識したこと","bullets":["サービスの世界観に合わせながら、タイポグラフィを過度に作り込まず、必要な内容とロゴが読み取りやすい状態にしました。","ロゴに合うフォントや、エコを連想する配色を用いました。","納期と要件に合わせて制作の重点を調整し、比較しやすい案を用意しました。"]},{"title":"制作内容・事業規模","body":"複数のバナー・画像を制作。関連サービスの利用者は約40万人（2024年10月時点）ですが、バナー自体の表示回数・クリック数を表すものではありません。"}]},{"id":"others3","title":"デザメモ広告用バナー・画像","category":"Graphic","role":"デザイン/ライティング","body":"「デザメモ」は、デザインカリキュラムを社内外向けにパッケージ化したものです。\n\nバナーや広告画像では特に文字のジャンプ率を意識し、強調したいところがすぐに分かるデザインにしました。\n\nデザイン全体はサービスの仕様やLPと合わせにいき、ポップさを意識しました。\n\n流入を増やすためにデザイン体験会も実施しており、まだ数名ではありますが、体験会に参加いただいた\n\n方で入社いただいたり、デザメモに入会いただいた方もいらっしゃいます。\n\nまたXとInstagramでの広告運用も行っております。","images":["dezamemo-taiken-1.jpg","dezamemo-banner-1.jpg","dezamemo-banner-2.jpg","dezamemo-banner-3.jpg"],"dimensions":{"dezamemo-taiken-1.jpg":{"width":800,"height":450},"dezamemo-banner-1.jpg":{"width":800,"height":450},"dezamemo-banner-2.jpg":{"width":3840,"height":1200},"dezamemo-banner-3.jpg":{"width":4800,"height":2520}},"startedAt":"2024-04","period":"2024.04 —","intro":"デザイン学習サービス『デザメモ』の広告画像・バナー制作と、X・Instagramでの広告運用に携わりました。","scope":"社内外向け教育サービス／広告画像・SNS・デザイン体験会","sections":[{"title":"ねらい","body":"サービスへの流入を増やし、デザインを学びたい人に内容や魅力を伝えることを目指しました。広告からLPや教材へ進んだ際にも、同じサービスだと感じられる表現に揃えました。"},{"title":"担当範囲","body":"広告画像・バナーのデザイン、ライティング、X・Instagramでの広告運用。サービスへの入口としてデザイン体験会も実施しました。"},{"title":"意識したこと","bullets":["文字サイズに差をつけ、最も伝えたい情報がすぐに目に入るようにしました。","カリキュラムやLPの世界観に合わせ、ポップで親しみやすい表現にしました。"]},{"title":"成果・反応","body":"体験会を含む取り組みのなかで、参加者から入社やデザメモ入会につながった例がありました。元のポートフォリオ作成時点では数名規模の実績です。","note":"広告画像単独の効果や、現在の累計実績を示すものではありません。"}]},{"id":"others4","title":"So i Source広告用画像・SNS投稿","category":"Graphic","role":"デザイン/ライティング","body":"現在は「デザメモ」という名称に変更になりましたが、その前身として「So i Source(ソーアイソース)」\n\nというデザイン・フロントエンドカリキュラムの販売を行っておりました。\n\nその際に旧TwitterやInstagram投稿による販促を行っておりました。\n\n内容としては、プログラミング初学者へお役立ち知識を発信するというものでした。\n\n「So i Source」という名称にちなんで、醤油イメージのキャラクターを制作し、投稿に用いました。\n\nカリキュラム自体もSNS投稿内容に関しても、仕事で忙しいであろうユーザーにはゆるっと楽しんでもらいたい\n\nという気持ちがあったため、キャラクターは手描きにし、口調や表情ものんびりさせていました。\n\nTwitterの投稿はよりポップに、Instagramの投稿はよりオシャレさを持った雰囲気にしていました。","images":["sis-1.jpg","sis-2.jpg","sis-3.jpg","sis-4.jpg","sis-5.jpg","sis-6.jpg","sis-7.jpg","sis-8.jpg","sis-10.jpg","sis-11.jpg","sis-12.jpg","sis-13.jpg"],"dimensions":{"sis-1.jpg":{"width":1280,"height":1280},"sis-2.jpg":{"width":1280,"height":1280},"sis-3.jpg":{"width":1280,"height":1280},"sis-4.jpg":{"width":1280,"height":1280},"sis-5.jpg":{"width":1280,"height":1280},"sis-6.jpg":{"width":1280,"height":1280},"sis-7.jpg":{"width":1280,"height":1280},"sis-8.jpg":{"width":1280,"height":1280},"sis-10.jpg":{"width":1000,"height":1000},"sis-11.jpg":{"width":1000,"height":1000},"sis-12.jpg":{"width":1200,"height":900},"sis-13.jpg":{"width":1200,"height":900}},"startedAt":"2022-08","period":"2022.08 — 2023.05","intro":"『デザメモ』の前身であるデザイン・フロントエンド教材『So i Source』の販促用画像・SNS投稿です。","scope":"学習カリキュラムの販促／旧Twitter・Instagram向け投稿","sections":[{"title":"ねらい","body":"プログラミング初学者へ役立つ知識を発信し、教材を知る入口をつくることを目指しました。仕事で忙しい人にも、気負わず楽しんでもらえる雰囲気を意図しました。"},{"title":"担当範囲","body":"投稿内容のライティング、広告・SNS画像のデザイン、醤油をモチーフにしたオリジナルキャラクター制作。"},{"title":"意識したこと","bullets":["サービス名にちなんだ手描きのキャラクターをつくり、口調や表情ものんびりしたものにしました。","旧Twitterではよりポップに、Instagramではより洗練された雰囲気に寄せ、媒体ごとの見せ方を調整しました。","学習情報の発信と、サービスへの親しみやすさを両立させました。"]},{"title":"制作内容・成果","body":"キャラクターと投稿画像を制作し、SNSで教材の販促・知識発信に使用。媒体に応じて表現を変える制作を経験しました。","note":"掲載は当時のブランド・サービス名による制作物です。"}]},{"id":"others5","title":"社内カリキュラム用デザイン","category":"Graphic","role":"デザイン/ライティング","body":"社内のフロントエンドカリキュラムのコーディング課題の見本デザインを制作しました。\n\nループや配列を学ぶために、繰り返しの要素をできるだけ盛り込んで、かつシンプルなデザインにしました。","images":["webpack-kadai-1.jpg","webpack-kadai-2.jpg","responsive-site-PC.jpg","responsive-site-SP.jpg"],"dimensions":{"webpack-kadai-1.jpg":{"width":1280,"height":1717},"webpack-kadai-2.jpg":{"width":1280,"height":1985},"responsive-site-PC.jpg":{"width":1280,"height":3950},"responsive-site-SP.jpg":{"width":320,"height":5478}},"startedAt":"2021-08","period":"2021.08 — 2024.12","intro":"社内のフロントエンドカリキュラムで、コーディング課題として使う見本デザインを制作しました。","scope":"社内教育用教材／フロントエンド初学者の実装課題","sections":[{"title":"ねらい","body":"ループや配列など、カリキュラムで学ぶ内容を実際の画面制作で練習できる見本を用意することが目的でした。"},{"title":"担当範囲","body":"コーディング課題の見本デザインと、掲載文章の制作。"},{"title":"意識したこと","body":"繰り返しの要素をできるだけ盛り込み、ループや配列を用いた実装につなげやすくしました。一方で、初学者が学習内容に集中できるよう、見た目はシンプルにまとめました。"},{"title":"制作内容・成果","body":"学習項目を画面の構成に落とし込んだ見本デザインを制作。装飾の複雑さより、課題として何を練習できるかを優先した教材制作です。"}]},{"id":"others6","title":"営業・社内資料","category":"Graphic","role":"デザイン/ライティング","body":"営業用資料や社内イベント資料の一部を掲載いたします。\n\n見やすさを担保しつつ、単調になりすぎないようにしていました。\n\n社内イベントで着るTシャツもデザイン制作しましたので、併せて掲載します。","images":["eigyo-1.jpg","eigyo-2.jpg","eigyo-3.jpg","eigyo-4.jpg","eigyo-5.jpg"],"dimensions":{"eigyo-1.jpg":{"width":800,"height":450},"eigyo-2.jpg":{"width":800,"height":450},"eigyo-3.jpg":{"width":800,"height":450},"eigyo-4.jpg":{"width":800,"height":450},"eigyo-5.jpg":{"width":1200,"height":1200}},"startedAt":"2021-08","period":"2021.08 — 2024.12","intro":"営業活動や社内イベントで使用する資料、イベント用Tシャツなど、社内外のコミュニケーションに関わる制作です。","scope":"営業資料・社内イベント資料・イベント用Tシャツ","sections":[{"title":"ねらい","body":"営業や社内イベントで必要な情報を、見やすく伝えることを目指しました。用途に応じた表現のなかで、単調にならない見せ方も意識しました。"},{"title":"担当範囲","body":"営業用資料・社内イベント資料のデザインとライティング、社内イベントで着用するTシャツのデザイン。"},{"title":"意識したこと","body":"情報の見やすさを確保しつつ、資料として単調になりすぎないことを重視しました。資料と衣服という異なる媒体で、目的に合わせた表現を制作しました。"},{"title":"制作内容・成果","body":"営業・イベント用の資料と、社内イベント用Tシャツを制作。掲載はその一部です。"}]},{"id":"others7","title":"ネット銀行のバナー","category":"Graphic","role":"デザイン","body":"ネット銀行案件にて、手が空いたタイミングで簡単なバナーを制作させていただきました。\n\n文字のジャンプ率と、補色を用いて見やすくするといった点が意識した点です。","images":["banner-bank.jpg"],"dimensions":{"banner-bank.jpg":{"width":840,"height":240}},"startedAt":"2022-02","period":"2022.02 — 2022.07","intro":"ネット銀行Webアプリの開発案件に参画するなかで、バナーデザインも担当しました。","scope":"ネット銀行案件に付随するバナー制作","sections":[{"title":"ねらい","body":"伝えたい文言が読み取りやすいバナーをつくることを重視しました。"},{"title":"担当範囲","body":"バナーのデザイン。マイページ開発と並行し、制作に対応しました。"},{"title":"意識したこと","body":"文字サイズの差で情報に優先順位をつけ、強調する箇所を明確にしました。補色の組み合わせも使い、文字と背景の見分けやすさを意識しました。"},{"title":"制作内容・成果","body":"銀行案件のバナーを制作。Webアプリの実装に加え、画像制作でも案件を支援しました。"}]},{"id":"cx","title":"AIチャットボットの会話設計","category":"CX","images":[],"role":"会話・UI設計 / 開発 / テスト / 運用保守 / 標準化・効率化","period":"2024.12 — 現在","link":"https://cat-ai.co.jp/casestudy/concierge24/","intro":"AIチャットボットのCXデザイナーとして、シナリオ・UI設計から開発、テスト、運用改善まで担当。利用者が迷わず案内を進められることと、公開後の品質改善を重視しています。","scope":"常時5〜7案件／営業・エンジニア・PM・デザイナー・QA・CS各1名の体制","sections":[{"title":"ねらい","body":"業務マニュアルの内容を整理し、利用者が必要な案内や受付にたどり着けるシナリオを設計します。自然な受け答えだけでなく、聞き直し・エラー・有人転送まで含め、実際の業務で使えることを目指しています。"},{"title":"担当範囲","bullets":["PDF・Excelのマニュアル読解、業務フロー整理、シナリオと会話UIの設計。","Figma・FigJamでの制作、社内独自ツールによるチャットボット開発。","LLMを活用したシナリオ作成の効率化、TTSの読み・抑揚調整。","テスト、リリース後の運用保守、改善提案、部下約2名の育成。"]},{"title":"意識していること","bullets":["利用者が何をしたいかを起点に、文言・質問の順番・画面を検討。ノード数や通話時間を必要以上に増やさず、迷いや負担の少ない案内を目指しています。","設計段階で社内レビューを実施し、到達できないノード、番号の重複・欠落、分岐のループ、聞き直し上限を確認しています。","テストの目的・確認観点・ケースをエンジニアやCSと共有。実装前の不明点と、実装後に起こり得る状態まで整理しています。"]},{"title":"目標と成果 01 シナリオの品質","fact":"目標：AI完遂率98％以上 → 実績平均：99.3％","body":"文言やシナリオの流れをレビューし、聞き直し・エラー・有人転送を含む動作を検証。利用者がシナリオ通りに案内を進められる状態を目指しました。","note":"AI完遂率は、シナリオ不備なく設計した到達点まで進んだ割合です。有人転送や想定された途中終話も含み、ボットだけで問い合わせを解決した割合ではありません。99.3％は評価期間ごとの実績の単純平均です。"},{"title":"成果 02 FAQの改善","fact":"FAQヒット率：約14％増（リリース月と翌月の比較）","body":"通話ログから、利用者が何を尋ねているか、その発話がどのような意図かを分析。エンジニアと連携し、質問の意図の分類や回答への振り分けを追加・調整しました。"},{"title":"成果 03 公開後の改善","fact":"7案件中4案件で改善を実施／改善版を計4回リリース","body":"公開後の利用状況と通話ログを確認し、案内が滞る箇所やFAQの課題を特定。PM・CS・エンジニアと改善方針を検討し、回答への振り分け追加や、リリース時に残っていた課題の修正を提案・実施しました。","note":"改善実施率は57％。保守契約に含まれる通常対応を除いた取り組みです。"},{"title":"成果 04 デザインシステムの整備","fact":"デザイン作成工数を従来の約半分に削減","body":"Webデザインの経験を活かし、約5名のデザイナーチームで標準化を主導。フォント・カラー、共通UI、AI発話表現を統一し、電話番号・住所聴取など再利用できる発話コンポーネントを作成しました。メンバーと分担し、整備を完了しました。"},{"title":"成果 05 納品・テスト準備の効率化","fact":"月間数時間程度の作業を削減","body":"FigmaからJSONを書き出し、マクロでExcel形式へ変換する仕組みを作成。Excel形式での納品や、テスト時のノード数・番号の洗い出しに活用しています。"},{"title":"設計ミス・手戻りを防ぐ取り組み","body":"納品後に自分の設計ミスによる修正依頼が発生しないことを目標に、変更管理のルールや確認項目を文書化しています。","bullets":["実装前：質問表で不明点と回答状況を整理し、Figmaの注釈で仕様・注意点を共有。","実装後：エンジニアからフィードバックを受け、テストで見つかった課題を一覧化。","公開後：不備の原因と対策を振り返り、次の案件に反映。担当者・進捗・未決事項が分かるよう、backlogの運用も見直しています。"]},{"title":"事業規模・所属","body":"常時5〜7案件程度を担当。2024年12月に株式会社トゥモロー・ネットのAIプラットフォーム本部 CXDユニットへ入社し、2026年7月に部門独立に伴い株式会社CAT.AIへ会社都合で転籍。現在はサービスデリバリー本部 CXDユニットで同業務を継続しています。","note":"守秘のため実画面・シナリオ本文は掲載していません。"},{"title":"個人開発・今後の検討","body":"FigJamフロー自動生成プラグインは開発中です。既存のFigma形式にとらわれず、AIが扱いやすい情報構造へ組み替えることや、ブラウザ上で先にモックを作って検証してからデザインへ起こす進め方も検討しています。","note":"開発中・構想段階の内容であり、完成済みの成果とは分けて掲載しています。"}]},{"id":"sales","category":"Career","images":[],"title":"人材営業","label":"CAREER / 2018.04 — 2021.07","intro":"パーソルキャリア株式会社で、法人向け人材紹介（RA）とスカウトメール配信（HA）を担当しました。","sections":[{"title":"法人向け人材紹介 / RA","period":"2018年4月〜2019年7月","bullets":["月40〜50社程度への働きかけ、アポイント獲得、経営者・人事担当への採用ニーズのヒアリング。","求人票の新規作成・改善、候補者の推薦、面談日程の調整、キャリアアドバイザーを介した候補者の意向確認。"],"body":"採用条件や企業の意向を細かく聞き取り、求人票を丁寧に作成。応募者への情報提供や推薦後の確認業務も効率よく進むように、最初の情報整理を重視しました。","fact":"RA在籍期間の平均予算達成率：105％"},{"title":"スカウトメール配信 / HA","period":"2019年8月〜2021年7月","bullets":["転職者に合わせたスカウトメールの作成・配信。手動で作り込むメールは1日20件程度。","営業担当約5名の進捗確認、アドバイス、応募後の営業活動のサポート。"],"body":"反応のよい求人やメールの魅力を分析し、企業への追加ヒアリングや他のHAの意見を取り入れて文面を改善しました。","fact":"2021年1月〜5月：5か月連続で予算達成（入社決定者数・面接案件増加数など）"}]},{"id":"web","category":"Career","images":[],"title":"Webデザイン・開発・運用","label":"CAREER / 2021.08 —","intro":"2021年8月に株式会社CONVICTIONへ入社。IT事務・サイト運用から、フロントエンド開発とWebデザインへ担当領域を広げ、社内教育やカリキュラム外販、SNS企画、採用業務補助も兼任しました。","sections":[{"title":"サステナブル関連Webアプリ","period":"2022年8月〜 / カボニューレコード","bullets":["サービス開始前から参画し、デザイナー1名体制でサービス全体のデザインを担当。","クライアントへのヒアリング、要件・機能・デザインの提案、ワイヤーフレーム・カンプ作成、コーダーへの指示、コーディング、文字校正。","週1回の会議を主催し、クライアントやPMと仕様・デザインについて意見交換。"],"body":"要件定義・開発・運用保守に携わりました。仕様変更の多いアジャイル開発のなかで、ペルソナや目的に立ち返って提案することを重視しました。","fact":"サービス全体の利用者数：約40万人、新規登録：1日平均60〜70人（2024年10月時点）","note":"利用者数はサービスの規模であり、自身の施策単独の獲得数を表すものではありません。プロジェクトは9名体制で、デザイナーは1名。"},{"title":"ネット銀行マイページの開発","period":"2022年2月〜7月","bullets":["詳細設計、UI設計、プログラムコーディング、単体テスト、保守メンテナンス。","銀行側のデザイン案を基に、見出しや装飾の一貫性などについてUI改善案を提示。"],"body":"PM1名・SE5名の6名体制。APIの完成を待つ間に進められる実装を整理するなど、チーム全体の進行を見据えて作業しました。"},{"title":"配信サイトの運用・CMS改善","period":"2021年11月〜2022年1月","bullets":["ボートレース配信の設定、配信用CMSの機能改善提案。","バナー・カルーセルのコーディング、Accessを使った配信状況の管理。"],"body":"5名のチームで運用を担当。設定ミスを防ぐことに加え、ミスが起きにくい状態をつくるためにCMSの改善案を出しました。"},{"title":"キャッシュレス事業のIT事務","period":"2021年8月〜10月","bullets":["全国のQRコード設置状況・導入状況の確認、営業資料の作成。","kintone・PowerPoint・Outlookを使用。"],"body":"営業・事務あわせて約20名の体制。確認項目やタスクの多い業務で、1日の処理計画を立て、正確さとスピードを両立できるように進めました。"},{"title":"社内教育・制作に共通する工夫","bullets":["初学者向けのデザイン・フロントエンドカリキュラム制作、社員教育、カリキュラム外販。","調査やユーザーの視点を根拠に提案し、エラー表示など実装後に起こり得る状態も設計段階で画面にして共有。","疑問点は、自分で検討した範囲と不明点を整理して早めに相談。周囲が相談しやすい関係づくりも意識。"]}]},{"id":"skills","title":"スキル・資格","category":"Career","images":[],"sections":[{"title":"会話・コンテンツ設計","body":"チャットボットシナリオ設計、会話UI設計、LLM活用、TTS調整、ライティング・校正、教育資料・カリキュラム作成"},{"title":"デザイン","body":"Figma / FigJam / Illustrator / Photoshop / XD / After Effects / CapCut"},{"title":"開発","body":"HTML / CSS / JavaScript / jQuery / Vue.js / Firebase / Git / Backlog / Google Analytics 4"},{"title":"学歴","body":"明治大学 文学部 文学科 日本文学専攻 卒業（2018年3月）"},{"title":"資格","body":"中学校・高等学校教諭一種免許（国語）、普通自動車第一種運転免許（いずれも2018年3月）。東京商工会議所 カラーコーディネーター検定 アドバンスクラス（2024年7月）"}]}]</script>
<script>'use strict';

const $ = id => document.getElementById(id);
const sea = document.documentElement.dataset.theme === 'aquarium';
const zones = (sea ? [
  ['Web / UI','浅瀬の回廊','ハナビラフィッシュ',0],
  ['App','サンゴの庭','ミナモエイ',18],
  ['Graphic','薄明の礁','ヒカリクラゲ',85],
  ['CX','発光の海溝','ランタンフィッシュ',420],
  ['Career','深海の記憶','ツキノクジラ',1200]
] : [
  ['Web / UI','ユニコーンの森','ルル・ユニコーン'],
  ['App','羽うさぎの庭','ミモ・ウィングラビット'],
  ['Graphic','花角の温室','フロル・ブルームディア'],
  ['CX','星狐の神殿','ノア・スターキツネ'],
  ['Career','月竜の丘','ネム・ムーンドラゴン']
]);
const labels = ['Web','App','Graphic','CX','経歴'];
const works = JSON.parse($('data').textContent);
const asset = (name, full = false) => 'https://hrmrn1125.github.io/haraport/assets/' + (full ? 'full/' : '') + encodeURIComponent(name);
const motion = matchMedia('(prefers-reduced-motion: reduce)');
const make = (tag, value, cls) => {
  const element = document.createElement(tag);
  if (value) element.textContent = value;
  if (cls) element.className = cls;
  return element;
};
let active = -1;
let selectedWorkButton;
const navButtons = zones.map((zone, index) => {
  const button = make('button', labels[index]);
  button.title = zone[1];
  button.addEventListener('click', () => go(index));
  $('zones').append(button);
  return button;
});
function go(index, focus = false) {
  active = index;
  selectCamera(index);
  $('intro').hidden = index !== -1;
  $('station').hidden = $('navigation').hidden = index === -1;
  $('gesture').hidden = index !== 0;
  $('depth').hidden = !sea || index === -1;
  if (index === -1) {
    $('enter').focus({preventScroll:true});
    return;
  }
  const [category,title,guide] = zones[index];
  $('guide').textContent = guide;
  $('station-title').textContent = title;
  const itemCount = works.filter(work => work.category === category).length;
  const noun = category === 'Career' ? '経歴' : '作品';
  $('catalog').querySelector('.catalog-label').textContent = noun + 'を見る';
  $('catalog').setAttribute('aria-label', title + 'の' + noun + 'を見る（' + itemCount + '件）');
  $('prev').disabled = index === 0;
  $('next').disabled = index === zones.length - 1;
  navButtons.forEach((button, position) => button.setAttribute('aria-current', String(index === position)));
  if (focus || document.activeElement?.disabled) $('station-title').focus({preventScroll:true});
}
function heading(title) {
  const h = make('h2', title);
  h.id = 'modal-title';
  $('detail').replaceChildren(h);
  $('modal').scrollTop = 0;
}
function catalog(restoreFocus = false) {
  const [category,title] = zones[active];
  heading(title);
  $('back').hidden = true;
  const grid = make('div', null, 'work-grid');
  for (const work of works.filter(item => item.category === category)) {
    const button = make('button', null, 'work');
    if (work.images[0]) {
      const img = make('img');
      img.src = asset(work.images[0]);
      img.alt = '';
      img.loading = 'lazy';
      button.append(img);
    }
    button.append(make('span', work.title));
    button.addEventListener('click', () => {
      selectedWorkButton = work.id;
      detail(work);
    });
    button.dataset.work = work.id;
    grid.append(button);
  }
  $('detail').append(grid);
  if (!$('modal').open) $('modal').showModal();
  if (restoreFocus) grid.querySelector(`[data-work="${selectedWorkButton}"]`)?.focus();
}
function paragraphs(container, text) {
  for (const paragraph of (text || '').split(/\n\s*\n/).filter(Boolean)) {
    container.append(make('p', paragraph.replace(/\n/g, '')));
  }
}
function detail(work) {
  heading(work.title);
  const article = $('detail');
  $('back').hidden = false;
  paragraphs(article, work.intro || work.body);
  const facts = make('dl');
  for (const [label,value] of [['期間',work.period || work.label?.replace('CAREER / ', '')],['担当',work.role],['制作規模',work.scope]]) {
    if (value) facts.append(make('dt',label),make('dd',value));
  }
  if (facts.childElementCount) article.append(facts);
  if (work.link) {

const swimmers = [];
const plankton = [];
const oceanColors = [[132,247,211],[104,224,235],[163,180,255],[86,253,231],[131,171,255]];
positions.forEach(([x,y,z],index) => {
  const rand=random(812+161*index);
  swimmers.push({p:[x,y+.65,z+.65],kind:index,size:index===4?2.25:1.52,color:oceanColors[index],phase:1,guide:true});
  for(let i=0;i<18;i++){
    const px=x+(rand()>.5?-1:1)*(2.5+rand()*7);
    const py=y-2.35+rand()*1.25;
    const pz=z+(rand()-.55)*20;
    reefs.push({p:[px,py,pz],size:.42+rand()*1.06,seed:i+31*index,color:i%5===0?[248,134,102]:oceanColors[index]});
  }
  for(let i=0;i<10;i++){
    swimmers.push({p:[x+(rand()-.5)*19,y+(rand()-.37)*8,z+(rand()-.5)*22],kind:i%4===0?2:0,size:.18+rand()*.58,color:oceanColors[(index+i)%5],phase:rand()*6,guide:false});
  }
  for(let i=0;i<135;i++){
    plankton.push({p:[x+(rand()-.5)*25,y+(rand()-.5)*14,z+(rand()-.5)*27],size:.8+rand()*1.7,phase:rand()*7});
  }
});

const fishShapes = [
  ['M-32 1 Q-12 -27 19 -20 Q38 -14 44 0 Q35 17 13 20 Q-12 23 -32 1Z','M-29 1 Q-50 -17 -62 -16 Q-55 -6 -53 0 Q-57 9 -61 17 Q-42 13 -29 1Z','M-8 -13 Q-6 -33 18 -29 Q13 -23 13 -16 M-1 13 Q0 29 22 27 L15 14'],
  ['M-42 8 Q-24 -16 2 -15 Q17 -12 47 -29 Q43 -2 23 12 Q9 27 -9 23 Q-25 21 -42 8Z','M-35 10 Q-51 15 -76 8 Q-86 2 -86 -4 Q-70 5 -39 3Z','M-11 13 Q2 30 24 30 Q13 24 10 15'],
  null,
  ['M-27 1 Q-16 -19 5 -20 Q23 -22 40 -8 L43 -2 Q33 -7 19 -1 Q34 0 42 7 Q29 25 10 26 Q-13 27 -27 1Z','M-24 2 Q-39 -12 -53 -14 L-49 1 L-54 15 Q-36 13 -24 2Z','M0 -16 Q6 -34 23 -30 L20 -17 M4 19 Q7 31 20 33 L15 20'],
  ['M-57 4 Q-30 -22 13 -16 Q48 -17 65 -6 Q70 -1 65 8 Q57 23 13 22 Q-28 22 -57 4Z','M-49 3 Q-64 -12 -79 -9 Q-76 1 -69 5 Q-80 11 -90 9 Q-80 23 -61 14 L-50 9Z','M-5 -12 Q-4 -29 9 -25 L14 -14 M15 14 Q0 31 24 33 L37 17']
];
function oceanGlow(x,y,r,color,opacity){
  const gradient=ctx.createRadialGradient(x,y,0,x,y,Math.max(r,1));
  gradient.addColorStop(0,`rgba(${color.join(',')},${opacity})`);
  gradient.addColorStop(.27,`rgba(${color.join(',')},${opacity*.48})`);
  gradient.addColorStop(1,`rgba(${color.join(',')},0)`);
  ctx.fillStyle=gradient;
  ctx.fillRect(x-r,y-r,2*r,2*r);
}

function drawSwimmer(swimmer,point,clock,deep,showHalo) {
  const [x,y,d,scale]=point;
  const size=Math.min(d<1?12:3,scale*.019*swimmer.size);
  if (size<.10 || x<-190 || x>width+190 || y<-180 || y>height+180) return;
  const {kind,color,guide,phase}=swimmer;
  const light=rgb(color);
  const pulse=.78+.22*Math.sin(clock*2+phase);
  ctx.save();
  ctx.globalAlpha=guide?1:Math.max(.22,.75-d*.011);
  if (showHalo) {
    ctx.globalCompositeOperation='screen';
    oceanGlow(x,y,size*(guide?107:62),color,(guide?.63:.29)*pulse*(.69+deep*.31));
    ctx.globalCompositeOperation='source-over';
  }
  ctx.translate(x,y);
  ctx.scale(size,size);
  ctx.rotate(Math.sin(clock*.85+phase)*.069 + (kind===1?-.20:0));
  if(kind===2){
    ctx.scale(1+.08*Math.sin(clock*2+phase),1-.07*Math.sin(clock*2+phase));
    const jelly=ctx.createLinearGradient(0,-33,0,16);
    jelly.addColorStop(0,'#d8fff4ec');
    jelly.addColorStop(.27,`rgba(${color.join(',')},.42)`);
    jelly.addColorStop(.90,`rgba(${color.join(',')},.12)`);
    jelly.addColorStop(1,light);
    for(let i=0;i<9;i++){
      const a=(i-4)*7;
      const bend=Math.sin(clock*1.5+i*.66+phase)*10;
      paint(`M${a} 10 Q${a+bend} 32 ${a*.65-bend*.45} 45 T${a*.96+bend} ${61+i%3*13}`,null,i%2?light:'#a3ffe27c',i%2?.6:1.05);
    }
    paint('M-34 11 C-33 -14 -17 -28 0 -30 C19 -30 33 -10 35 11 Q22 19 4 17 Q-17 21 -34 11Z',jelly,light,1.05);
    for(let i=-2;i<=2;i++){
      paint(`M${i*12} 13 Q${i*15} -12 0 -29`,null,'#e2fff76b',.66);
      ellipse(i*13,14,1.8,1.1,'#e6fff7');
    }
  } else {
    const [body,tail,fins]=fishShapes[kind];
    const gradient=ctx.createLinearGradient(0,-23,0,25);
    gradient.addColorStop(0,light);
    gradient.addColorStop(.31,tint(color,[13,51,76],.54));
    gradient.addColorStop(.73,tint(color,[5,25,46],.77));
    gradient.addColorStop(1,tint(color,[5,32,57],.17));
    ctx.save();
    ctx.scale(1+Math.sin(clock*4+phase)*.11,1);
    paint(tail,gradient,light,.7);
    ctx.restore();
    paint(fins,gradient,light,.43);
    paint(body,gradient,light,.83);
    const eye=kind===4?50:kind===1?23:26;
    ellipse(eye,-3,3.9,3.5,'#042231');
    ellipse(eye+.6,-4.2,1.35,1.18,'#c9fff6');
    if(kind!==1) paint(`M${eye-6} 1 Q${eye-11} 7 ${eye-8} 12`,null,'#befff284',.9);
    for(let n=0;n<11;n++){
      const lx=(kind===4?-34:-22)+n*(kind===4?5:3.4);
      const ly=4+Math.sin(n*.36)*4;
      ellipse(lx,ly,.6+(n%3)*.18,.64,n%3===0?'#c6fff4':light);
      if(guide)ellipse(lx+1,ly-6,.58,.58,'#c6fff478');
    }
    if(kind===3){
      paint('M17 -16 Q16 -47 32 -53 Q49 -56 50 -39',null,light,1);
      oceanGlow(50,-38,20,color,.96*pulse);
      ellipse(50,-38,3.6,3.6,'#dcfff5');
    }
  }
  ctx.restore();
}

function drawReef(reef,point,clock,deep){
  const [x,y,d,s]=point;
  const size=Math.min(8,s*.015*reef.size);
  if(size<.17 || x<-190 || x>width+190 || y<-140 || y>height+180) return;
  const rand=random(reef.seed);
  const color=reef.color;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size,size);
  const rock=ctx.createLinearGradient(0,-30,0,20);
  rock.addColorStop(0,tint(color,[10,26,48],.76));
  rock.addColorStop(1,'#061421');
  paint('M-48 7 Q-42 -8 -32 -8 L-23 -25 L-6 -26 L6 -20 L22 -19 L31 -7 Q43 -3 52 13 L42 26 L-39 22Z',rock);
  for(let j=0;j<8;j++){
    const stem=(rand()-.5)*52;
    const lean=(rand()-.5)*42+Math.sin(clock+j+reef.seed)*4;
    const length=16+rand()*48;
    const hue=tint(color,[8,45,62],.59-deep*.22);
    const tip=stem+lean;
    paint(`M${stem} 6 Q${stem-lean*.26} ${-length*.69} ${tip} ${-length}`,null,hue,.8+rand()*1.4);
    if(j%2===0)paint(`M${stem+lean*.1} ${-length*.51} Q${stem+lean*.34+13} ${-length*.62} ${tip+8} ${-length*.79}`,null,hue,.87);
    if(d<28 && j%2===0) oceanGlow(tip,-length,7,color,.44+deep*.24);
    ellipse(tip,-length,1.5,1.5,rgb(color));
  }
  ctx.restore();
}

function drawOcean(project,clock,deep,travel) {
  const W=width,H=height;
  const sunlight=Math.pow(1-deep,2.4);
  const beamX=W*(.69+Math.sin(clock*.45)*.043);
  const background=ctx.createLinearGradient(0,0,W*.21,H);
  background.addColorStop(0,rgb(mix([25,123,148],[1,5,19],deep)));
  background.addColorStop(.52,rgb(mix([18,88,110],[4,17,35],deep)));
  background.addColorStop(1,'#020814');
  ctx.fillStyle=background;
  ctx.fillRect(0,0,W,H);
  oceanGlow(beamX,H*.05,Math.max(W,H)*.85,[101,245,234],sunlight*.70);
  oceanGlow(W*.64,H*.48,Math.max(W,H)*.58,[28,86,169],.10+deep*.17);
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<10 && sunlight>.01;i++){
    const topX=beamX+(i-4)*W*.044;
    const lowerX=topX+W*(.065*(i-4)+.026*Math.sin(clock*.5+i));
    const glow=ctx.createLinearGradient(topX,0,lowerX,H*.86);
    glow.addColorStop(0,`rgba(175,255,236,${(.064+.028*Math.sin(clock*.7+i))*sunlight})`);
    glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.moveTo(topX-W*.015,0);
    ctx.lineTo(topX+W*.011,0);
    ctx.lineTo(lowerX+W*.064,H);
    ctx.lineTo(lowerX-W*.058,H);
    ctx.fill();
  }
  ctx.restore();
  // Seafloor and far walls frame a passage rather than a floating exhibit.
  const slope=H*(.73+.052*Math.sin(current.eye[2]*.035));
  const floor=ctx.createLinearGradient(0,slope-H*.10,0,H);
  floor.addColorStop(0,'#173a5052');
  floor.addColorStop(.60,'#071526cb');
  floor.addColorStop(1,'#020713');
  ctx.save();
  ctx.translate(0,slope);
  ctx.scale(W,H);
  paint('M0 -.07 Q.14 -.20 .26 -.045 Q.35 .045 .47 .032 Q.59 .025 .71 -.022 Q.88 -.144 1 -.09 L1 .36 L0 .36 Z',floor);
  ctx.restore();
  const walls=ctx.createLinearGradient(0,H*.36,0,H);
  walls.addColorStop(0,'#0b2033ac');
  walls.addColorStop(1,'#020711');
  ctx.save();
  const shift=Math.sin(current.eye[0]*.14)*W*.04;
  ctx.translate(shift,slope);
  ctx.scale(W,H);
  paint('M-.23 -.24 Q-.06 -.28 .03 -.14 Q.14 -.15 .20 -.03 Q.25 .025 .32 .041 Q.33 .061 .38 .098 L.48 .37 L-.23 .38Z',walls);
  paint('M1.22 -.36 Q1.07 -.37 .995 -.22 Q.92 -.16 .89 -.071 Q.82 -.061 .80 .029 Q.74 .025 .68 .17 L.51 .37 L1.25 .46Z',walls);
  ctx.restore();
  const scenery=[];
  for(const reef of reefs){
    const p=project(reef.p);
    if(p && p[2]<68)scenery.push({p,reef});
  }
  for(const fish of swimmers){
    const [x,y,z]=fish.p;
    const w=fish.phase+clock*(fish.guide?.57:.73);
    const p=project([x+Math.sin(w)*(fish.guide?.52:1.63),y+Math.sin(w*1.34)*.33,z+Math.cos(w)*.50]);
    if(!p||p[2]>65) continue;
    if(fish.guide && fish.kind===active) guideArea={x:p[0],y:p[1],radius:Math.max(42,p[3]*1.25)};
    scenery.push({p,fish});
  }
  scenery.sort((a,b)=>b.p[2]-a.p[2]);
  for(const item of scenery){
    if(item.reef) drawReef(item.reef,item.p,clock,deep);
    else drawSwimmer(item.fish,item.p,clock,deep,item.p[2]<32);
  }
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(const particle of plankton) {
    const [x,y,z]=particle.p;
    const point=project([x+Math.sin(clock*.42+particle.phase)*.4,y+Math.sin(clock*.32+particle.phase)*.7,z]);
    if(!point||point[2]>50||point[0]<-15||point[0]>W+15||point[1]<-15||point[1]>H+15) continue;
    const radius=Math.min(7,Math.max(.45,particle.size*point[3]*.018));
    const alpha=(.2+.29*(.5+.5*Math.sin(clock*1.8+particle.phase)))*Math.min(1,point[2]*.6);
    ctx.globalAlpha=alpha;
    dot(point[0],point[1],radius,'#a5fff0');
    if(radius>2.15) oceanGlow(point[0],point[1],radius*(3+travel),[69,230,251],.54);
  }
  ctx.restore();
  const edge=ctx.createRadialGradient(W*.59,H*.43,H*.16,W*.54,H*.44,Math.max(W,H)*.67);
  edge.addColorStop(0,'transparent');
  edge.addColorStop(1,`rgba(0,3,13,${.49+deep*.29})`);
  ctx.fillStyle=edge;
  ctx.fillRect(0,0,W,H);
}

function render(time) {
  if (!ctx) return;
  const ratio = Math.min(devicePixelRatio,1.75);
  const bounds = canvas.getBoundingClientRect();
  if (bounds.width !== width || bounds.height !== height || canvas.width !== Math.round(bounds.width*ratio)) {
    width=bounds.width;
    height=bounds.height;
    canvas.width=Math.round(width*ratio);
    canvas.height=Math.round(height*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }
  const t=motion.matches?1:Math.max(0,Math.min(1,(time-started)/duration));
  const eased=t*t*(3-2*t);
  const arc=Math.sin(Math.PI*t);
  const clock=motion.matches?0:time*.001;
  const range=length(vector(target.eye,start.eye));
  const bank=Math.min(range*.13,4.3)*arc;
  const eye=mix(start.eye,target.eye,eased);
  const look=mix(start.look,target.look,eased);
  if(sea){
    const direction=Math.sign(target.depth-start.depth) || 1;
    eye[0]+=bank*direction;
    eye[1]+=bank*.22;
    look[1]-=bank*.74*direction;
    look[0]-=bank*.27;
  }
  current={eye,look,depth:lerp(start.depth,target.depth,eased),meters:lerp(start.meters,target.meters,eased)};
  guideArea=undefined;
  if(!sea){
    drawZoo(clock,t,(target.eye[2]-start.eye[2])*arc*width*.005);
    finishScene();
    return;
  }
  const depthLabel=Math.round(current.meters).toLocaleString('ja-JP')+' m';
  if($('depth').textContent!==depthLabel) $('depth').textContent=depthLabel;
  const forward=unit(vector(look,eye));
  const right=unit(cross(forward,[Math.sin(-bank*.018),1,0]));
  const up=cross(right,forward);
  const zoom=(mobile()?Math.min(width*1.06,height*.63):Math.min(height*.89,width*.71))*(1-.13*arc);
  const origin=[width*(mobile()?.52:.65),height*(mobile()?.37:.43)];
  function project(point) {
    const offset=vector(point,eye);
    const distance=inner(offset,forward);
    if(distance<.4)return null;
    const scale=zoom/distance;
    return [origin[0]+inner(offset,right)*scale,origin[1]-inner(offset,up)*scale,distance,scale];
  }
  drawOcean(project,clock,current.depth,arc);
  finishScene();
}

let frame;
function animate(time) {
  render(time);
  if(!motion.matches && !document.hidden) frame=requestAnimationFrame(animate);
}
function restart() {
  cancelAnimationFrame(frame);
  if(!document.hidden) frame=requestAnimationFrame(animate);
}
motion.addEventListener('change',restart);
document.addEventListener('visibilitychange',restart);
window.addEventListener('resize',restart);
if (ctx) restart();
</script>
