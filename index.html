<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6dac5">
<meta name="description" content="Companion Ledger | 小さな家族の健康帳">
<title>Companion Ledger | 小さな家族の健康帳</title>
<style>
:root{
  --canvas:#d5b78a;
  --app:#ece1cc;
  --paper:#f5ecdb;
  --paper-2:#f8f1e3;
  --panel:#f7efdf;
  --ink:#342820;
  --muted:#7a6a5b;
  --line:#b89d77;
  --line-soft:#d8c8af;
  --accent:#806240;
  --accent-deep:#62492f;
  --forest:#566a58;
  --shadow:0 12px 34px rgba(68,45,26,.16);
  --header-serif:"Iowan Old Style","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(180deg,#b49463 0%,#cab087 12%,#d8c19e 20%,#d8c19e 100%);font-family:var(--sans);color:var(--ink)}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:transparent;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;max-width:100%;min-width:0;border:1px solid #c7b18d;background:#fffdf8;color:var(--ink);border-radius:2px;padding:12px 12px;font-size:16px;min-height:48px;box-shadow:inset 0 0 0 1px #efe4d1}
textarea{min-height:112px;resize:vertical}
img{display:block;max-width:100%}
svg{display:block}
.hidden{display:none!important}
.app-shell{max-width:460px;margin:0 auto;min-height:100dvh;background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.28), transparent 28%),
    radial-gradient(circle at 80% 15%, rgba(255,255,255,.20), transparent 20%),
    radial-gradient(circle at 10% 60%, rgba(118,96,62,.05), transparent 20%),
    linear-gradient(90deg,rgba(117,84,49,.16) 0 1px, transparent 1px 100%),
    radial-gradient(#9e8864 0.6px, transparent 0.75px) 0 0/7px 7px,
    var(--app);
  border-left:1px solid rgba(98,73,47,.35);border-right:1px solid rgba(98,73,47,.35);box-shadow:0 0 46px rgba(45,29,14,.18);position:relative;padding:18px 16px calc(110px + env(safe-area-inset-bottom));overflow-x:hidden}
.app-shell::before,.app-shell::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(110,83,54,.28);pointer-events:none}
.app-shell::before{left:9px}.app-shell::after{right:9px}
.header{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:10px 0 14px;border-bottom:3px double rgba(96,70,42,.55);position:sticky;top:0;background:linear-gradient(180deg,rgba(236,225,204,.97),rgba(236,225,204,.95));backdrop-filter:blur(8px);z-index:20}
.brand-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#f5edde,#e9ddc8);border:2px solid var(--line);box-shadow:inset 0 0 0 2px #f8f1e4, var(--shadow);color:var(--accent-deep);flex:0 0 auto}
.brand-mark .icon{width:28px;height:28px}
.brand-title{font-family:var(--header-serif);font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1.05}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.picker-btn{display:flex;align-items:center;gap:10px;padding:11px 12px;border:2px solid var(--line);background:linear-gradient(180deg,#f7efdf,#f0e4d0);box-shadow:inset 0 0 0 1px #fff5e7;min-width:112px;justify-content:space-between;font-size:14px;flex:0 0 auto}
.page{display:none;padding-top:18px}.page.active{display:block}
.page-kicker{font-family:var(--header-serif);font-size:13px;letter-spacing:.20em;text-transform:uppercase;color:#6f5f50;margin-bottom:6px}
.page-title{font-family:var(--header-serif);font-size:34px;line-height:1.15;font-weight:700;margin:0 0 10px;letter-spacing:.02em}
.rule{display:flex;align-items:center;gap:8px;margin:6px 0 18px;color:var(--line)}
.rule::before,.rule::after{content:"";height:1px;background:linear-gradient(90deg,transparent, currentColor, transparent);flex:1}
.rule .diamond{width:10px;height:10px;background:currentColor;transform:rotate(45deg);flex:0 0 auto;opacity:.95}
.frontispiece{margin:0 0 16px;padding:6px 0 2px;color:#8a6d49}
.frontispiece svg{width:100%;height:auto}
.panel{position:relative;background:linear-gradient(180deg,rgba(250,245,234,.82),rgba(244,236,219,.92));border:3px double var(--line);box-shadow:inset 0 0 0 1px #eee1ca, var(--shadow)}
.card{padding:14px}
.hero-card{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center}
.frame{position:relative;background:linear-gradient(180deg,#f0e4cd,#e7d4b3);border:3px double var(--line);padding:8px;box-shadow:inset 0 0 0 1px #fff5e9}
.frame::before,.frame::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--line);border-left:none;border-bottom:none;top:8px;left:8px;opacity:.75}
.frame::after{top:auto;left:auto;right:8px;bottom:8px;transform:rotate(180deg)}
.portrait-frame{aspect-ratio:1/1.05;border-radius:2px;overflow:hidden;background:linear-gradient(180deg,#f6eedf,#ebddc6)}
.portrait-frame .portrait-inner{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
.portrait-photo{width:100%;height:100%;object-fit:cover;filter:sepia(.55) contrast(1.02) saturate(.55) brightness(1.03)}
.portrait-figure{width:100%;height:100%;color:#5b4839}
.pet-name{font-family:var(--header-serif);font-size:28px;font-weight:700;letter-spacing:.03em;line-height:1.1;margin:0 0 10px}
.pet-meta{font-size:16px;color:#51453b;line-height:1.45}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat-box{padding:12px;background:linear-gradient(180deg,rgba(248,242,230,.86),rgba(241,233,217,.96));border:2px solid rgba(184,157,119,.75);box-shadow:inset 0 0 0 1px #f9f0df}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-family:var(--header-serif);font-size:28px;color:var(--forest);font-weight:700;line-height:1}
.stat-value span{font-size:14px;margin-left:4px;color:var(--muted);font-family:var(--sans)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:22px 0 10px}
.section-title{font-family:var(--header-serif);font-size:28px;font-weight:700;line-height:1.1;margin:0}
.section-action{font-size:16px;font-weight:700;color:var(--accent-deep)}
.primary-btn,.secondary-btn,.ghost-btn,.mini-btn,.fab{border:2px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,245,229,.9);transition:.18s ease}
.primary-btn:hover,.secondary-btn:hover,.ghost-btn:hover,.mini-btn:hover,.picker-btn:hover,.nav-btn:hover,.fab:hover{filter:brightness(.98)}
.primary-btn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(180deg,#76563a,#5b432d);color:#fff7ee;font-weight:700;font-size:17px}
.primary-btn .icon,.section-action .icon,.mini-btn .icon,.fab .icon,.nav-btn .icon,.list-icon .icon,.record-chip .icon,.picker-btn .icon{width:1.22em;height:1.22em}
.secondary-btn{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(180deg,#f8f1e5,#eadbc2);color:var(--ink);font-weight:700}
.ghost-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(248,240,226,.78);font-weight:700}
.mini-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(180deg,#f7efdf,#e8dbc3);font-size:14px;font-weight:700}
.button-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick-record{margin-top:10px}
.schedule-preview,.record-row,.pet-row,.event-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-bottom:1px solid rgba(184,157,119,.45)}
.record-row:last-child,.pet-row:last-child,.event-row:last-child{border-bottom:none}
.list-icon{display:grid;place-items:center;width:40px;height:40px;border:2px solid rgba(184,157,119,.72);background:linear-gradient(180deg,#f8f1e2,#ece0c9);color:var(--accent-deep)}
.list-icon .icon{width:25px;height:25px}
.entry-title{font-size:18px;font-weight:700;line-height:1.35}
.entry-sub,.entry-meta{font-size:13px;color:var(--muted);line-height:1.45}
.date-pill{display:grid;place-items:center;width:60px;padding:8px 4px;border:2px solid rgba(184,157,119,.75);background:linear-gradient(180deg,#f7efdf,#e7d7bd)}
.date-pill strong{font-family:var(--header-serif);font-size:28px;line-height:1}.date-pill small{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 8px;border:1px solid rgba(184,157,119,.55);background:rgba(251,246,237,.75)}
.empty{padding:18px;text-align:center;color:var(--muted)}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}
.record-chip{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 13px;border:2px solid var(--line);background:linear-gradient(180deg,#f7efdf,#eaddc5);font-weight:700;font-size:15px;color:#55473a}
.record-chip.active{background:linear-gradient(180deg,#6e5338,#5a432e);color:#fff8ef}
.chart-card{padding:12px 12px 8px}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.chart-head .section-action{font-size:15px}
.chart{width:100%;height:auto}
.chart-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 8px 4px}
.calendar-card{padding:14px}.calendar-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:12px}.month-title{font-family:var(--header-serif);font-size:26px;text-align:center}
.icon-square{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--line);background:linear-gradient(180deg,#f8f1e5,#eadbc2);color:var(--accent-deep)}
.icon-square .icon{width:24px;height:24px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-grid .wk{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px}.calendar-grid .day{min-height:44px;border:1px solid rgba(184,157,119,.55);background:rgba(251,245,236,.72);display:grid;place-items:center;position:relative;font-size:14px}.calendar-grid .day.out{opacity:.38}.calendar-grid .day.today{border:2px solid var(--accent)}.calendar-grid .day.has::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--accent-deep)}
.pet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.profile-grid{display:grid;gap:12px;margin-top:12px}.profile-line{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid rgba(184,157,119,.42)}.profile-line:last-child{border-bottom:none}.profile-label{font-size:14px;color:var(--muted)}.profile-value{font-size:16px;line-height:1.6}
.pet-row{width:100%;text-align:left;background:transparent}.pet-row small{display:block;color:var(--muted);font-size:12px}.pet-row .entry-title{font-size:16px}
.delete-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;color:#8d6b57}.delete-btn .icon{width:22px;height:22px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(236,225,204,0),rgba(236,225,204,.96) 18%,rgba(236,225,204,.98));backdrop-filter:blur(8px);z-index:22}
.nav-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:12px 8px 8px;background:rgba(234,221,198,.95);border-top:2px solid rgba(98,73,47,.5);box-shadow:0 -4px 0 rgba(255,249,238,.6) inset}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;color:#8d755d;font-weight:700;font-size:13px}
.nav-btn.active{color:#32271f}.nav-btn .icon{width:1.45em;height:1.45em}
.fab{position:absolute;left:50%;transform:translateX(-50%);top:-14px;background:linear-gradient(180deg,#6f5338,#5a412c);color:#fff7ef;padding:12px 18px;border-radius:999px;display:flex;align-items:center;gap:9px;font-weight:700;box-shadow:0 10px 18px rgba(62,43,27,.25)}
.modal-backdrop{position:fixed;inset:0;background:rgba(42,28,17,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}.modal-backdrop.show{display:flex}
.modal{width:min(100%, 420px);max-height:min(88dvh, 760px);overflow:auto;background:linear-gradient(180deg,#f7efdf,#efe1c6);border:3px double var(--line);box-shadow:0 18px 48px rgba(39,24,12,.3);padding:18px}
.modal-head{display:flex;align-items:start;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:2px solid rgba(184,157,119,.6);margin-bottom:14px}.modal-title{font-family:var(--header-serif);font-size:28px;line-height:1.1;font-weight:700}.modal-close{display:grid;place-items:center;width:52px;height:52px;border:2px solid var(--line);background:rgba(250,243,232,.7);font-size:40px;line-height:1;color:#4d3c2f;flex:0 0 auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:7px;min-width:0}.field.full{grid-column:1 / -1}.field label{font-size:16px;font-weight:700}.field small{color:var(--muted)}
.form-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
input[type="file"]{display:none}
.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.action-card{display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(180deg,#f8f1e6,#eadcc3);border:2px solid var(--line);font-weight:700;text-align:left}.action-card .icon{width:26px;height:26px;color:var(--accent-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:98px;background:#4b3725;color:#fff7ed;padding:10px 14px;border-radius:999px;box-shadow:0 12px 24px rgba(0,0,0,.22);font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:430px){
  .page-title{font-size:32px}
  .hero-card{grid-template-columns:100px minmax(0,1fr)}
  .pet-name{font-size:26px}
}
@media (max-width:390px){
  .app-shell{padding-left:14px;padding-right:14px}
  .brand-title{font-size:20px}
  .picker-btn{min-width:104px;padding-inline:10px}
  .page-title{font-size:30px}
  .section-title{font-size:26px}
  .hero-card{grid-template-columns:1fr;justify-items:start}
  .stat-grid,.button-row,.action-grid,.form-actions,.form-grid{grid-template-columns:1fr}
  .profile-line{grid-template-columns:1fr}
}
</style>
</head>

<script>
(() => {
  const STORAGE_KEY = 'companion-ledger-v2';
  const typeMeta = {
    all:{label:'すべて',icon:'i-note'},
    weight:{label:'体重',icon:'i-weight'},
    food:{label:'ごはん',icon:'i-food'},
    walk:{label:'散歩',icon:'i-walk'},
    toilet:{label:'トイレ',icon:'i-toilet'},
    condition:{label:'体調',icon:'i-heart'},
    visit:{label:'通院',icon:'i-visit'},
    grooming:{label:'お手入れ',icon:'i-scissors'},
    schedule:{label:'予定',icon:'i-calendar'}
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const todayISO = (offset=0) => {
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate()+offset);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const nowTime = () => {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };
  const fmtDate = (iso) => {
    if (!iso) return '未設定';
    const [y,m,d] = iso.split('-');
    return `${Number(m)}月${Number(d)}日`;
  };
  const fmtDateLong = (iso) => {
    if (!iso) return '未登録';
    const [y,m,d] = iso.split('-');
    return `${y}年${Number(m)}月${Number(d)}日`;
  };
  const ageText = (birthday) => {
    if (!birthday) return '';
    const b = new Date(`${birthday}T00:00:00`);
    const n = new Date();
    let age = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate() < b.getDate())) age--;
    return `${age}歳`;
  };
  const svgUse = (id) => `<svg class="icon" aria-hidden="true"><use href="#${id}"/></svg>`;
  const renderDefaultPortrait = (kind='dog') => `<svg class="portrait-figure" aria-hidden="true"><use href="#${kind === 'cat' ? 'i-cat-portrait':'i-dog-portrait'}"/></svg>`;
  const renderPortrait = (pet) => pet.photo ? `<img class="portrait-photo" src="${pet.photo}" alt="${esc(pet.name)}の写真">` : renderDefaultPortrait(pet.kind);
  const defaultData = () => ({
    activePetId: 1,
    pets: [
      {id:1,name:'こむぎ',kind:'dog',breed:'トイプードル',sex:'女の子',birthday:'2022-05-15',allergy:'なし',note:'ささみが好き。お散歩は公園コース。',photo:''},
      {id:2,name:'もふ',kind:'dog',breed:'ウェルシュ・コーギー',sex:'男の子',birthday:'2021-09-02',allergy:'鶏肉を少し控えめ',note:'ボール遊びが好き。',photo:''}
    ],
    records: [
      {id:1,petId:1,type:'food',value:'朝ごはん',note:'完食',date:todayISO(),time:'08:00'},
      {id:2,petId:1,type:'walk',value:'25',note:'公園を一周',date:todayISO(),time:'09:20'},
      {id:3,petId:1,type:'condition',value:'元気',note:'食欲あり',date:todayISO(),time:'10:00'},
      {id:4,petId:1,type:'weight',value:'4.2',note:'',date:todayISO(-1),time:'08:00'},
      {id:5,petId:1,type:'weight',value:'4.1',note:'',date:todayISO(-8),time:'08:00'},
      {id:6,petId:1,type:'weight',value:'4.0',note:'',date:todayISO(-15),time:'08:00'},
      {id:7,petId:1,type:'toilet',value:'通常',note:'問題なし',date:todayISO(),time:'11:00'}
    ],
    schedules: [
      {id:101,petId:1,type:'visit',title:'健康診断',memo:'かかりつけの動物病院',date:todayISO(7)},
      {id:102,petId:1,type:'grooming',title:'トリミング',memo:'予約確認',date:todayISO(18)}
    ]
  });
  let state = load();
  let currentPage = 'home';
  let currentFilter = 'all';
  let calendarBase = new Date();
  calendarBase.setDate(1);

  function load(){
    try{const raw = localStorage.getItem(STORAGE_KEY); if(!raw) return defaultData(); const parsed = JSON.parse(raw); if(!parsed?.pets) return defaultData(); return parsed;}catch{return defaultData();}
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2000); }
  function pet(){ return state.pets.find(p=>p.id===state.activePetId) || state.pets[0]; }
  function records(petId=state.activePetId){ return state.records.filter(r=>r.petId===petId).sort((a,b)=>`${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`)); }
  function schedules(petId=state.activePetId){ return state.schedules.filter(s=>s.petId===petId).sort((a,b)=>a.date.localeCompare(b.date)); }
  function recordLabel(rec){ return rec.type==='walk' ? `${rec.value}分` : rec.type==='weight' ? `${rec.value}kg` : rec.value; }
  function setPage(page){ currentPage=page; document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active', el.id===`page-${page}`)); document.querySelectorAll('.nav-btn').forEach(el=>el.classList.toggle('active', el.dataset.page===page)); window.scrollTo({top:0,behavior:'smooth'}); }
  function modal(title, bodyHtml){ $('modalTitle').textContent=title; $('modalBody').innerHTML=bodyHtml; $('modalBackdrop').classList.add('show'); $('modalBackdrop').setAttribute('aria-hidden','false'); const focusable = $('modalBody').querySelector('input,select,textarea,button'); if(focusable) setTimeout(()=>focusable.focus({preventScroll:true}),30); }
  function closeModal(){ $('modalBackdrop').classList.remove('show'); $('modalBackdrop').setAttribute('aria-hidden','true'); }

  function renderHome(){
    const p = pet();
    const all = records();
    const today = all.filter(r=>r.date===todayISO());
    const latestWeight = all.find(r=>r.type==='weight');
    const walkMinutes = today.filter(r=>r.type==='walk').reduce((sum, r)=>sum + (Number(r.value)||0), 0);
    const next = schedules().find(s=>s.date>=todayISO());
    $('dateLabel').textContent = new Intl.DateTimeFormat('en-US', {month:'long', day:'numeric', year:'numeric'}).format(new Date()).toUpperCase();
    $('headerPetName').textContent = p.name;
    $('heroName').textContent = p.name;
    $('heroMeta').textContent = [p.breed, ageText(p.birthday)].filter(Boolean).join(' / ');
    $('homePortrait').innerHTML = renderPortrait(p);
    $('latestWeight').innerHTML = latestWeight ? `${esc(latestWeight.value)}<span>kg</span>` : `—<span>kg</span>`;
    $('weightDate').textContent = latestWeight ? fmtDate(latestWeight.date) : '未記録';
    $('walkToday').innerHTML = `${walkMinutes}<span>分</span>`;
    $('homeUpcoming').innerHTML = next ? `
      <div class="schedule-preview">
        <div class="date-pill"><strong>${Number(next.date.slice(8))}</strong><small>${Number(next.date.slice(5,7))}月</small></div>
        <div><div class="entry-title">${esc(next.title)}</div><div class="entry-sub">${esc(next.memo || typeMeta[next.type]?.label || '')}</div></div>
        <div class="list-icon">${svgUse(typeMeta[next.type]?.icon || 'i-calendar')}</div>
      </div>` : `<div class="empty">予定はありません</div>`;
  }
  function renderRecordFilters(){
    $('recordFilters').innerHTML = ['all','weight','food','walk','toilet','condition'].map(type=>`<button type="button" class="record-chip ${currentFilter===type?'active':''}" data-filter="${type}">${svgUse(typeMeta[type].icon)}<span>${typeMeta[type].label}</span></button>`).join('');
  }
  function recordsHTML(rows){
    if(!rows.length) return `<div class="empty">記録はありません</div>`;
    return rows.map(r=>`<div class="record-row"><div class="list-icon">${svgUse(typeMeta[r.type].icon)}</div><div><div class="entry-title">${esc(typeMeta[r.type].label)}・${esc(recordLabel(r))}</div><div class="entry-sub">${esc(r.note || '')}</div></div><div style="display:grid;justify-items:end;gap:2px"><div class="entry-meta">${fmtDate(r.date)}<br>${esc(r.time)}</div><button type="button" class="delete-btn" data-del-record="${r.id}" aria-label="記録を削除">${svgUse('i-trash')}</button></div></div>`).join('');
  }
  function drawChart(){
    const svg = $('weightChart'); svg.innerHTML='';
    const data = records().filter(r=>r.type==='weight').reverse().slice(-7);
    if(!data.length){ svg.innerHTML='<text x="180" y="96" text-anchor="middle" fill="#7d6d5d" font-size="14">体重記録がありません</text>'; return; }
    const values = data.map(d=>Number(d.value));
    const min = Math.min(...values), max=Math.max(...values), pad=max===min?0.8:Math.max(0.2,(max-min)*0.45);
    const yMin=min-pad,yMax=max+pad; const W=360,H=180,left=28,right=20,top=18,bottom=32,plotW=W-left-right,plotH=H-top-bottom;
    const x = i => left + (data.length===1 ? plotW/2 : plotW*i/(data.length-1));
    const y = v => top + ((yMax-v)/(yMax-yMin))*plotH;
    const make = (tag, attrs, text) => { const el=document.createElementNS('http://www.w3.org/2000/svg',tag); Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v)); if(text!=null) el.textContent=text; svg.appendChild(el); return el; };
    [0, .33, .66, 1].forEach(t=>{ const yy = top + plotH*t; make('line',{x1:left,y1:yy,x2:W-right,y2:yy,stroke:'#d6c7af','stroke-dasharray':'4 6'}); });
    const path = data.map((d,i)=>`${i?'L':'M'} ${x(i)} ${y(Number(d.value))}`).join(' ');
    make('path',{d:path,fill:'none',stroke:'#576c5b','stroke-width':'4','stroke-linecap':'round','stroke-linejoin':'round'});
    data.forEach((d,i)=>{ make('circle',{cx:x(i),cy:y(Number(d.value)),r:'6',fill:'#f8f1e3',stroke:'#576c5b','stroke-width':'3'}); make('text',{x:x(i),y:H-10,'text-anchor':'middle',fill:'#7d6d5d','font-size':'11'}, `${Number(d.date.slice(5,7))}/${Number(d.date.slice(8))}`); });
    const last=data[data.length-1];
    make('text',{x:W-right-4,y:34,'text-anchor':'end',fill:'#576c5b','font-size':'18','font-weight':'700'}, `${last.value} kg`);
  }
  function renderRecords(){
    renderRecordFilters();
    drawChart();
    const filtered = currentFilter==='all' ? records() : records().filter(r=>r.type===currentFilter);
    $('recordList').innerHTML = recordsHTML(filtered);
  }
  function renderCalendar(){
    const y = calendarBase.getFullYear(), m = calendarBase.getMonth();
    $('calendarLabel').textContent = `${y}年 ${m+1}月`;
    const grid = $('calendarGrid');
    const week = ['月','火','水','木','金','土','日'];
    grid.innerHTML = week.map(w=>`<div class="wk">${w}</div>`).join('');
    const first = new Date(y,m,1); const offset=(first.getDay()+6)%7; const start = new Date(y,m,1-offset); const markSet = new Set(schedules().map(s=>s.date));
    for(let i=0;i<35;i++){
      const d = new Date(start); d.setDate(start.getDate()+i); const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; const classes=['day'];
      if(d.getMonth()!==m) classes.push('out'); if(iso===todayISO()) classes.push('today'); if(markSet.has(iso)) classes.push('has');
      grid.insertAdjacentHTML('beforeend', `<div class="${classes.join(' ')}">${d.getDate()}</div>`);
    }
  }
  function renderSchedules(){
    renderCalendar();
    const rows = schedules();
    $('scheduleList').innerHTML = rows.length ? rows.map(s=>`<div class="event-row"><div class="date-pill"><strong>${Number(s.date.slice(8))}</strong><small>${Number(s.date.slice(5,7))}月</small></div><div><div class="entry-title">${esc(s.title)}</div><div class="entry-sub">${esc(s.memo || '')}</div></div><div style="display:grid;justify-items:end;gap:4px"><div class="list-icon">${svgUse(typeMeta[s.type]?.icon || 'i-calendar')}</div><button type="button" class="delete-btn" data-del-schedule="${s.id}" aria-label="予定を削除">${svgUse('i-trash')}</button></div></div>`).join('') : '<div class="empty">予定はありません</div>';
  }
  function renderProfile(){
    const p = pet();
    $('profilePortrait').innerHTML = renderPortrait(p);
    $('profileName').textContent = p.name;
    $('profileBreed').textContent = [p.breed, ageText(p.birthday)].filter(Boolean).join(' / ');
    $('profileInfo').innerHTML = [
      ['誕生日', fmtDateLong(p.birthday)],
      ['性別', p.sex || '未登録'],
      ['アレルギー', p.allergy || 'なし'],
      ['メモ', p.note || '—']
    ].map(([label,val])=>`<div class="profile-line"><div class="profile-label">${label}</div><div class="profile-value">${esc(val)}</div></div>`).join('');
    $('petList').innerHTML = state.pets.map(q=>`<button type="button" class="pet-row" data-pet="${q.id}"><div><div class="entry-title">${esc(q.name)}</div><small>${esc([q.breed, ageText(q.birthday)].filter(Boolean).join(' / '))}</small></div><div class="badge">${q.id===state.activePetId ? '表示中' : '切替'}</div></button>`).join('');
  }
  function renderAll(){ renderHome(); renderRecords(); renderSchedules(); renderProfile(); }

  function openRecordChooser(){
    modal('記録する', `<div class="action-grid">${['food','walk','toilet','condition','weight'].map(type=>`<button type="button" class="action-card" data-record-type="${type}">${svgUse(typeMeta[type].icon)}<span>${typeMeta[type].label}</span></button>`).join('')}</div>`);
    document.querySelectorAll('[data-record-type]').forEach(btn=>btn.addEventListener('click',()=>openRecordForm(btn.dataset.recordType)));
  }
  function openRecordForm(type='food'){
    const presets = {food:['内容','朝ごはん'],walk:['時間（分）','25'],toilet:['状態','通常'],condition:['状態','元気'],weight:['体重（kg）','4.2']};
    modal('記録を追加', `
      <form id="recordForm">
        <div class="form-grid">
          <div class="field full"><label>種類</label><select name="type" id="recordType">${['food','walk','toilet','condition','weight'].map(t=>`<option value="${t}">${typeMeta[t].label}</option>`).join('')}</select></div>
          <div class="field full"><label id="recordValueLabel">内容</label><input type="text" name="value" id="recordValue" required maxlength="40"></div>
          <div class="field"><label>日付</label><input type="date" name="date" value="${todayISO()}" required></div>
          <div class="field"><label>時刻</label><input type="time" name="time" value="${nowTime()}" required></div>
          <div class="field full"><label>メモ（任意）</label><textarea name="note"></textarea></div>
        </div>
        <div class="form-actions"><button type="button" class="secondary-btn" id="cancelRecordBtn">キャンセル</button><button type="submit" class="primary-btn">保存</button></div>
      </form>`);
    const typeEl = $('recordType'); const valueLabel = $('recordValueLabel'); const valueInput = $('recordValue');
    function syncPreset(){ valueLabel.textContent = presets[typeEl.value][0]; valueInput.placeholder = presets[typeEl.value][1]; valueInput.value = presets[typeEl.value][1]; }
    typeEl.value = type; syncPreset(); typeEl.addEventListener('change', syncPreset);
    $('cancelRecordBtn').onclick = closeModal;
    $('recordForm').onsubmit = (e)=>{ e.preventDefault(); const fd = new FormData(e.currentTarget); state.records.unshift({id:Date.now(),petId:state.activePetId,type:String(fd.get('type')),value:String(fd.get('value')).trim(),note:String(fd.get('note')).trim(),date:String(fd.get('date')),time:String(fd.get('time'))}); save(); closeModal(); renderAll(); toast('記録を追加したよ'); setPage('records'); };
  }
  function openScheduleForm(){
    modal('予定を追加', `
      <form id="scheduleForm">
        <div class="form-grid">
          <div class="field full"><label>種類</label><select name="type"><option value="visit">通院</option><option value="grooming">お手入れ</option></select></div>
          <div class="field full"><label>予定名</label><input name="title" required maxlength="40" placeholder="例：健康診断"></div>
          <div class="field full"><label>日付</label><input type="date" name="date" value="${todayISO(7)}" required></div>
          <div class="field full"><label>メモ（任意）</label><textarea name="memo"></textarea></div>
        </div>
        <div class="form-actions"><button type="button" class="secondary-btn" id="cancelScheduleBtn">キャンセル</button><button type="submit" class="primary-btn">保存</button></div>
      </form>`);
    $('cancelScheduleBtn').onclick = closeModal;
    $('scheduleForm').onsubmit = (e)=>{ e.preventDefault(); const fd = new FormData(e.currentTarget); state.schedules.push({id:Date.now(),petId:state.activePetId,type:String(fd.get('type')),title:String(fd.get('title')).trim(),memo:String(fd.get('memo')).trim(),date:String(fd.get('date'))}); save(); closeModal(); renderAll(); toast('予定を追加したよ'); setPage('schedule'); };
  }
  function openPetForm(editMode=true){
    const p = editMode ? pet() : {name:'',kind:'dog',breed:'',sex:'',birthday:'',allergy:'',note:'',photo:''};
    modal(editMode ? 'プロフィールを編集' : 'ペットを追加', `
      <form id="petForm">
        <div class="form-grid">
          <div class="field full"><label>名前</label><input name="name" value="${esc(p.name)}" required maxlength="24"></div>
          <div class="field"><label>種類</label><select name="kind"><option value="dog">犬</option><option value="cat">猫</option></select></div>
          <div class="field"><label>犬種・猫種</label><input name="breed" value="${esc(p.breed)}" maxlength="32"></div>
          <div class="field"><label>誕生日</label><input type="date" name="birthday" value="${esc(p.birthday)}"></div>
          <div class="field"><label>性別</label><input name="sex" value="${esc(p.sex)}" maxlength="16"></div>
          <div class="field full"><label>アレルギー</label><input name="allergy" value="${esc(p.allergy)}" maxlength="40"></div>
          <div class="field full"><label>メモ</label><textarea name="note">${esc(p.note)}</textarea></div>
        </div>
        <div class="form-actions"><button type="button" class="secondary-btn" id="cancelPetBtn">キャンセル</button><button type="submit" class="primary-btn">保存</button></div>
      </form>`);
    $('petForm').kind.value = p.kind;
    $('cancelPetBtn').onclick = closeModal;
    $('petForm').onsubmit = (e)=>{ e.preventDefault(); const fd = new FormData(e.currentTarget); const payload={name:String(fd.get('name')).trim(),kind:String(fd.get('kind')),breed:String(fd.get('breed')).trim(),sex:String(fd.get('sex')).trim(),birthday:String(fd.get('birthday')).trim(),allergy:String(fd.get('allergy')).trim(),note:String(fd.get('note')).trim()}; if(editMode){ const idx = state.pets.findIndex(x=>x.id===state.activePetId); state.pets[idx] = {...state.pets[idx], ...payload}; }else{ const id=Date.now(); state.pets.push({id,photo:'',...payload}); state.activePetId=id; } save(); closeModal(); renderAll(); toast(editMode ? 'プロフィールを更新したよ':'ペットを追加したよ'); setPage('profile'); };
  }
  function openPetPicker(){
    modal('ペットを選ぶ', `<div class="panel">${state.pets.map(q=>`<button type="button" class="pet-row" data-pick-pet="${q.id}"><div><div class="entry-title">${esc(q.name)}</div><small>${esc(q.breed || '')}</small></div><div class="badge">${q.id===state.activePetId?'表示中':'選択'}</div></button>`).join('')}</div><div class="form-actions"><button type="button" class="secondary-btn" id="pickerCloseBtn">閉じる</button><button type="button" class="primary-btn" id="pickerAddBtn">ペットを追加</button></div>`);
    document.querySelectorAll('[data-pick-pet]').forEach(btn=>btn.addEventListener('click',()=>{ state.activePetId = Number(btn.dataset.pickPet); save(); closeModal(); renderAll(); toast('表示するペットを切り替えたよ'); }));
    $('pickerCloseBtn').onclick = closeModal; $('pickerAddBtn').onclick = ()=>openPetForm(false);
  }
  function handlePhotoUpload(file){
    if(!file) return; const reader = new FileReader(); reader.onload = () => { const idx = state.pets.findIndex(p=>p.id===state.activePetId); state.pets[idx].photo = String(reader.result); save(); renderAll(); toast('写真を設定したよ'); }; reader.readAsDataURL(file);
  }

  function bind(){
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>setPage(btn.dataset.page)));
    $('petPickerBtn').onclick = openPetPicker;
    $('fabRecordBtn').onclick = openRecordChooser;
    $('recordAddTopBtn').onclick = openRecordChooser;
    $('recordAddListBtn').onclick = openRecordChooser;
    $('scheduleAddBtn').onclick = openScheduleForm;
    $('addScheduleInlineBtn').onclick = openScheduleForm;
    $('profileEditBtn').onclick = ()=>openPetForm(true);
    $('petAddBtn').onclick = ()=>openPetForm(false);
    $('photoSetBtn').onclick = ()=>$('photoInput').click();
    $('photoResetBtn').onclick = ()=>{ const idx=state.pets.findIndex(p=>p.id===state.activePetId); state.pets[idx].photo=''; save(); renderAll(); toast('初期の肖像に戻したよ'); };
    $('photoInput').addEventListener('change', (e)=>handlePhotoUpload(e.target.files?.[0]));
    $('prevMonthBtn').onclick = ()=>{ calendarBase.setMonth(calendarBase.getMonth()-1); renderSchedules(); };
    $('nextMonthBtn').onclick = ()=>{ calendarBase.setMonth(calendarBase.getMonth()+1); renderSchedules(); };
    $('recordFilters').addEventListener('click', (e)=>{ const btn=e.target.closest('[data-filter]'); if(!btn) return; currentFilter=btn.dataset.filter; renderRecords(); });
    $('petList').addEventListener('click', (e)=>{ const btn=e.target.closest('[data-pet]'); if(!btn) return; state.activePetId=Number(btn.dataset.pet); save(); renderAll(); toast('表示するペットを切り替えたよ'); });
    $('recordList').addEventListener('click', (e)=>{ const btn=e.target.closest('[data-del-record]'); if(!btn) return; state.records = state.records.filter(r=>r.id!==Number(btn.dataset.delRecord)); save(); renderAll(); toast('記録を削除したよ'); });
    $('scheduleList').addEventListener('click', (e)=>{ const btn=e.target.closest('[data-del-schedule]'); if(!btn) return; state.schedules = state.schedules.filter(s=>s.id!==Number(btn.dataset.delSchedule)); save(); renderAll(); toast('予定を削除したよ'); });
    $('modalCloseBtn').onclick = closeModal;
    $('modalBackdrop').addEventListener('click', (e)=>{ if(e.target=== $('modalBackdrop')) closeModal(); });
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });
  }

  bind();
  renderAll();
})();
</script>
</body>
</html>
