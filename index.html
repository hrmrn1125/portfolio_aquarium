const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notice('保存に失敗しました')}};const pet=()=>state.pets.find(p=>p.id===state.activePetId)||state.pets[0];const entries=()=>state.records.filter(r=>r.petId===state.activePetId).sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')));const events=()=>state.schedules.filter(r=>r.petId===state.activePetId).sort((a,b)=>a.date.localeCompare(b.date));const age=b=>{if(!b)return '年齢未登録';const d=new Date(b+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||n.getMonth()===d.getMonth()&&n.getDate()<d.getDate())a--;return a>=0?a+'歳':'未登録'};const animal=p=>p.kind==='cat'?'cat':'dog';
function notice(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function tab(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));scrollTo({top:0,behavior:'smooth'})}
function modal(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;$('modalBack').classList.add('visible');const focus=$('modalContent').querySelector('input,select');if(focus)focus.focus({preventScroll:true})}function close(){$('modalBack').classList.remove('visible')}
function format(r){return r.type==='weight'?`${esc(r.value)} kg`:r.type==='walk'?`${esc(r.value)} 分`:esc(r.value)}
function recordsHTML(arr){return arr.length?arr.map(r=>`<div class="record"><div class="record-icon">${ico(glyphs[r.type]||'book')}</div><div class="record-main"><strong>${names[r.type]||'記録'} · ${format(r)}</strong>${r.note?`<p>${esc(r.note)}</p>`:''}</div><div class="record-date">${fmt(r.date)}<br>${esc(r.time||'')}<br><button class="delete-btn" data-remove-record="${r.id}" aria-label="記録を削除">${ico('trash')}</button></div></div>`).join(''):'<div class="empty">記録はまだありません</div>'}
function portraitHTML(p){
if(typeof p.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,/i.test(p.photo))return `<img class="portrait-photo" src="${p.photo}" alt="${esc(p.name)}の写真">`;

function renderHome(){const p=pet(),rows=entries(),today=rows.filter(x=>x.date===stamp()),w=rows.find(x=>x.type==='weight'),walk=today.filter(x=>x.type==='walk').reduce((n,x)=>n+(Number(x.value)||0),0),next=events().find(x=>x.date>=stamp());$('dateLabel').textContent=new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(new Date()).toUpperCase();$('headerPet').textContent=p.name;$('heroName').textContent=p.name;$('heroMeta').textContent=[p.breed,age(p.birthday)].filter(Boolean).join(' / ');$('heroPortrait').innerHTML=portraitHTML(p);$('latestWeight').innerHTML=w?`${esc(w.value)}<span>kg</span>`:'—<span>kg</span>';$('weightDate').textContent=w?fmt(w.date):'未記録';$('walkToday').innerHTML=`${walk}<span>分</span>`;$('homeRecords').innerHTML=recordsHTML(today.slice(0,3));$('homeUpcoming').innerHTML=next?`<div class="schedule-preview"><div class="date-stamp"><strong>${Number(next.date.slice(8))}</strong><small>${Number(next.date.slice(5,7))}月</small></div><div><div class="preview-title">${esc(next.title)}</div><div class="preview-sub">${esc(next.memo||names[next.type]||'予定')}</div></div>${ico(glyphs[next.type]||'calendar')}</div>`:'<div class="empty">予定はありません</div>'}
function chart(){const data=entries().filter(r=>r.type==='weight'&&Number(r.value)>0).reverse().slice(-7),s=$('weightChart');s.textContent='';const ns='http://www.w3.org/2000/svg',element=(tag,attrs,value)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(value!=null)e.textContent=value;s.append(e);return e};[38,72,106].forEach(y=>element('line',{x1:16,x2:308,y1:y,y2:y,stroke:'#dbceba','stroke-dasharray':'3 4'}));if(!data.length){element('text',{x:160,y:80,fill:'#786e62','font-size':12,'text-anchor':'middle'},'体重の記録はありません');return}const vals=data.map(x=>Number(x.value)),lo=Math.min(...vals),hi=Math.max(...vals),padding=Math.max((hi-lo)*.35,.25),y=v=>113-(v-(lo-padding))/(hi-lo+2*padding)*83,x=i=>data.length===1?160:22+280*i/(data.length-1),coords=data.map((d,i)=>`${x(i)},${y(Number(d.value))}`).join(' ');if(data.length>1)element('polyline',{points:coords,fill:'none',stroke:'#566752','stroke-width':2.4,'stroke-linecap':'round'});data.forEach((d,i)=>{element('circle',{cx:x(i),cy:y(Number(d.value)),r:3.7,stroke:'#566752',fill:'#f7f0e2','stroke-width':2});element('text',{x:x(i),y:132,fill:'#786e62','font-size':9,'text-anchor':'middle'},fmt(d.date))});element('text',{x:304,y:20,fill:'#566752','text-anchor':'end','font-size':14,'font-weight':'bold'},vals.at(-1)+' kg')}
function renderRecords(){const arr=entries();$('allRecords').innerHTML=recordsHTML(filter==='all'?arr:arr.filter(r=>r.type===filter));document.querySelectorAll('.filter').forEach(e=>e.classList.toggle('active',e.dataset.filter===filter));chart()}
function calendar(){const y=month.getFullYear(),m=month.getMonth();$('monthLabel').textContent=`${y}年 ${m+1}月`;const parent=$('calendarDays');parent.innerHTML=['月','火','水','木','金','土','日'].map(x=>`<div class="weekday">${x}</div>`).join('');let start=new Date(y,m,1),offset=(start.getDay()+6)%7;const days=new Date(y,m+1,0).getDate(),count=Math.ceil((offset+days)/7)*7,marked=new Set(events().map(x=>x.date));for(let i=0;i<count;i++){const d=new Date(y,m,i-offset+1),dt=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),klass=['day'];if(d.getMonth()!==m)klass.push('other');if(dt===stamp())klass.push('current');if(marked.has(dt))klass.push('marked');parent.insertAdjacentHTML('beforeend',`<div class="${klass.join(' ')}">${d.getDate()}</div>`)}}
function renderSchedule(){calendar();$('scheduleItems').innerHTML=events().length?events().map(r=>`<div class="panel agenda-item"><div class="date-stamp"><strong>${Number(r.date.slice(8))}</strong><small>${Number(r.date.slice(5,7))}月</small></div><div><div class="entry-title">${esc(r.title)}</div><div class="entry-note">${esc(r.memo||names[r.type]||'')}</div></div><button class="delete-btn" data-remove-event="${r.id}" aria-label="予定を削除">${ico('trash')}</button></div>`).join(''):'<div class="panel empty">予定はありません</div>'}
function renderProfile(){const p=pet();$('profilePortrait').innerHTML=portraitHTML(p);$('resetPortrait').disabled=!p.photo;$('profileName').textContent=p.name;$('profileBreed').textContent=p.breed||'種類未登録';$('profileInfo').innerHTML=[['誕生日',human(p.birthday)],['性別',p.sex||'未登録'],['アレルギー',p.allergy||'未登録'],['メモ',p.note||'—']].map(x=>`<div class="profile-field"><span>${x[0]}</span><span>${esc(x[1])}</span></div>`).join('');$('petRows').innerHTML=state.pets.map(q=>`<button class="pet-row" data-pet="${q.id}"><div><strong>${esc(q.name)}</strong><small>${esc(q.breed||'')}</small></div>${q.id===state.activePetId?'<span class="micro">表示中</span>':ico('chevron')}</button>`).join('')}
function render(){renderHome();renderRecords();renderSchedule();renderProfile()}
const presets={food:['内容','朝ごはん',false],walk:['時間（分）','25',true],toilet:['状態','通常',false],condition:['状態','元気',false],weight:['体重（kg）','4.2',true]};
function openRecordChooser(){
const types=['food','walk','toilet','condition','weight'];
modal('記録する',`<div class="record-chooser">${types.map(t=>`<button type="button" class="record-choice" data-choose-record="${t}">${ico(glyphs[t])}<span>${names[t]}</span></button>`).join('')}</div>`);
$('modalContent').querySelectorAll('[data-choose-record]').forEach(b=>b.onclick=()=>addRecord(b.dataset.chooseRecord));
}
function addRecord(type='food'){modal('記録を追加',`<form id="recordForm" class="form"><label class="field">種類<select id="recordType" name="type">${['food','walk','toilet','condition','weight'].map(t=>`<option value="${t}">${names[t]}</option>`).join('')}</select></label><label class="field"><span id="valueLabel">内容</span><input name="value" id="valueInput" required maxlength="70"></label><div class="form-grid"><label class="field">日付<input name="date" type="date" value="${stamp()}" required></label><label class="field">時刻<input name="time" type="time" value="${clock()}"></label></div><label class="field">メモ（任意）<textarea name="note" maxlength="400"></textarea></label><div class="btn-row"><button type="button" class="secondary" id="cancelForm">キャンセル</button><button class="primary" type="submit">保存</button></div></form>`);const select=$('recordType'),input=$('valueInput');select.value=type;function refresh(){const [name,val,numeric]=presets[select.value];$('valueLabel').textContent=name;input.type=numeric?'number':'text';input.value=val;if(numeric){input.min='0.01';input.step=select.value==='weight'?'0.01':'1'}else{input.removeAttribute('min');input.removeAttribute('step')}}select.onchange=refresh;refresh();$('cancelForm').onclick=close;$('recordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=String(f.get('value')).trim(),t=f.get('type');if(!v)return;if((t==='weight'||t==='walk')&&(!(Number(v)>0)||!Number.isFinite(Number(v)))){notice('正しい数値を入力してください');return}state.records.push({id:Date.now(),petId:state.activePetId,type:t,value:v,note:String(f.get('note')||'').trim(),date:f.get('date'),time:f.get('time')});save();close();render();notice('保存しました')}}
function addEvent(){modal('予定を追加',`<form id="eventForm" class="form"><label class="field">種類<select name="type"><option value="visit">通院</option><option value="medicine">お薬</option><option value="vaccine">予防接種</option><option value="grooming">トリミング</option><option value="other">その他</option></select></label><label class="field">予定名<input name="title" required maxlength="70" placeholder="例：健康診断"></label><label class="field">日付<input name="date" type="date" value="${stamp(7)}" required></label><label class="field">メモ（任意）<textarea name="memo" maxlength="400"></textarea></label><div class="btn-row"><button type="button" class="secondary" id="cancelForm">キャンセル</button><button class="primary" type="submit">保存</button></div></form>`);$('cancelForm').onclick=close;$('eventForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.schedules.push({id:Date.now(),petId:state.activePetId,type:f.get('type'),title:String(f.get('title')).trim(),date:f.get('date'),memo:String(f.get('memo')||'').trim()});save();close();render();notice('予定を保存しました')}}
function editPet(isNew=false){const p=isNew?{name:'',kind:'dog',breed:'',birthday:'',sex:'',allergy:'',note:''}:pet();modal(isNew?'ペットを追加':'プロフィールを編集',`<form id="petForm" class="form"><label class="field">名前<input name="name" required maxlength="40" value="${esc(p.name)}"></label><div class="form-grid"><label class="field">種類<select name="kind"><option value="dog">犬</option><option value="cat">猫</option></select></label><label class="field">犬種・猫種<input name="breed" maxlength="80" value="${esc(p.breed)}"></label></div><div class="form-grid"><label class="field">誕生日<input type="date" name="birthday" value="${esc(p.birthday)}"></label><label class="field">性別<input name="sex" maxlength="25" value="${esc(p.sex)}"></label></div><label class="field">アレルギー<input name="allergy" maxlength="160" value="${esc(p.allergy||'')}"></label><label class="field">メモ<textarea name="note" maxlength="400">${esc(p.note||'')}</textarea></label><div class="btn-row"><button type="button" class="secondary" id="cancelForm">キャンセル</button><button class="primary" type="submit">保存</button></div></form>`);$('petForm').elements.kind.value=p.kind;$('cancelForm').onclick=close;$('petForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={name:String(f.get('name')).trim(),kind:f.get('kind'),breed:String(f.get('breed')).trim(),birthday:f.get('birthday'),sex:String(f.get('sex')).trim(),allergy:String(f.get('allergy')).trim(),note:String(f.get('note')).trim()};if(isNew){data.id=Date.now();state.pets.push(data);state.activePetId=data.id}else Object.assign(p,data);save();close();render();notice('保存しました')}}
async function setPortraitPhoto(file){
if(!file)return;
if(!file.type.startsWith('image/')){notice('画像を選んでください');return;}
if(file.size>18*1024*1024){notice('18MB以下の画像を選んでください');return;}
const src=URL.createObjectURL(file);
try{
  const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('image'));img.src=src;});
  const canvas=document.createElement('canvas');
  canvas.width=480;canvas.height=530;
  const cx=canvas.getContext('2d');
  cx.fillStyle='#ede0c6';cx.fillRect(0,0,480,530);
  const ratio=Math.max(480/img.naturalWidth,530/img.naturalHeight);
  const w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;
  cx.drawImage(img,(480-w)/2,(530-h)/2,w,h);
  const url=canvas.toDataURL('image/jpeg',.76);
  const p=pet(),before=p.photo||'';
  p.photo=url;
  try{localStorage.setItem(KEY,JSON.stringify(state));render();notice('写真を設定しました');}
  catch(e){p.photo=before;notice('保存容量が不足しています');}
}catch(e){notice('写真を読み込めませんでした')}
finally{URL.revokeObjectURL(src);$('portraitFile').value='';}
}
function resetPortraitPhoto(){
  const p=pet();if(!p.photo)return;
  const before=p.photo;p.photo='';
  try{localStorage.setItem(KEY,JSON.stringify(state));render();notice('デフォルトの肖像に戻しました');}
  catch(e){p.photo=before;notice('保存に失敗しました')}
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-record],[data-filter],[data-pet],[data-remove-record],[data-remove-event]');if(!t)return;if(t.dataset.tab)tab(t.dataset.tab);else if(t.dataset.record)addRecord(t.dataset.record);else if(t.dataset.filter){filter=t.dataset.filter;renderRecords()}else if(t.dataset.pet){state.activePetId=Number(t.dataset.pet);save();render();tab('home')}else if(t.dataset.removeRecord)removeRecord(Number(t.dataset.removeRecord));else if(t.dataset.removeEvent)removeEvent(Number(t.dataset.removeEvent))});$('addSchedule').onclick=addEvent;$('editPet').onclick=()=>editPet();$('addPet').onclick=()=>editPet(true);$('petSwitch').onclick=()=>tab('profile');$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderSchedule()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderSchedule()};$('recordFab').onclick=openRecordChooser;

$('closeModal').onclick=close;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
})();
